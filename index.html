   ===================================================================== */
const ST_LABEL = { valid:['有效打卡','ok','✓'], late:['補打卡（計入）','late','補'], pending:['補登待審核','pend','審'], missing:['缺少紀錄','bad','缺'], invalid:['無效紀錄','gray','✕'], todo:['今天還沒打卡','brand','今'] };
function calendarHTML(map, act, month, sel, actPrefix='cal'){
  const [y,m] = month.split('-').map(Number);
  const first = new Date(y,m-1,1), days = new Date(y,m,0).getDate();
  const minM = act.start.slice(0,7), maxM = (diffDays(act.end,todayStr())>0 ? act.end : todayStr()).slice(0,7);
  let cells = WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for (let i=0;i<first.getDay();i++) cells += '<div class="d blank"></div>';
  for (let i=1;i<=days;i++){
    const ds = y+'-'+pad(m)+'-'+pad(i), e = map[ds];
    const inAct = diffDays(act.start, ds)>=0 && diffDays(ds, act.end)>=0;
    const future = diffDays(ds, todayStr()) < 0;
    let cls='d', mark='';
    if (!inAct || future) cls += ' out';
    else if (e) { cls += ' s-'+(e.status==='todo'?'todo':e.status); mark = ST_LABEL[e.status][2]; }
    if (sel===ds) cls += ' sel';
    cells += `<button class="${cls}" data-act="${actPrefix}-day" data-d="${ds}" ${(!inAct||future)?'disabled':''} aria-label="${ds} ${e?ST_LABEL[e.status][0]:''}">${i}${mark?`<small>${mark}</small>`:''}</button>`;
  }
  return `<div class="cal-head"><button data-act="${actPrefix}-prev" ${month<=minM?'disabled':''} aria-label="上個月">‹</button>
    <b style="font-size:20px">${y} 年 ${m} 月</b><button data-act="${actPrefix}-next" ${month>=maxM?'disabled':''} aria-label="下個月">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend">${['valid','late','pending','missing','invalid'].map(k=>`<span class="pill ${ST_LABEL[k][1]}">${ST_LABEL[k][2]} ${ST_LABEL[k][0]}</span>`).join('')}</div>`;
}
function dayMap(pr){ const m={}; if (pr && pr.days) Object.keys(pr.days).forEach(d=>{ m[d]={status:pr.days[d]}; }); return m; }
function monthShift(mo, n){ const [y,m]=mo.split('-').map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }

  const pct = Math.min(100, Math.round(pr.valid/Math.max(1,act.threshold)*100));
  main.innerHTML = `

    ${pr.todayDone?'':'<button class="btn btn-primary mb" data-act="compose-today">＋ 今天還沒打卡，現在打卡</button>'}
    <div class="card"><h2 class="act-name">${esc(act.name)}</h2>

      <div class="bar light" style="margin-top:12px"><i style="width:${pct}%"></i></div>
      <div class="stat-grid mt">
        <div class="stat ok"><div class="v">${pr.valid}<small>天</small></div><div class="k">✅ 有效打卡</div></div>
        ${act.threshold?`<div class="stat"><div class="v">${pr.need}<small>天</small></div><div class="k">🎯 還差幾天達標</div></div>`:`<div class="stat"><div class="v">${pr.missing||0}<small>天</small></div><div class="k">📭 沒打卡的天數</div></div>`}

      </div>
      ${pr.late||pr.pending?`<div class="hint">${pr.late?`<span class="nw">其中補打卡 ${pr.late} 天</span>`:''}${pr.late&&pr.pending?'<wbr><span class="nw">・</span>':''}${pr.pending?`<span class="nw">待管理員審核 ${pr.pending} 篇</span>`:''}</div>`:''}
      ${notesHTML(pr.notes, act)}
      <div class="hint mt"><span class="nw">補登 ${act.lateDays} 天內算有效；</span><wbr><span class="nw">達標以管理員結算為準。</span></div>
    </div>
    <div id="my-dream"></div>
    <div class="card"><h3>打卡日曆</h3><div id="cal">${calendarHTML(dayMap(pr), act, S.calMonth, S.calSel)}</div><div id="day-detail"></div></div>

          <div class="tk-top"><b>掃碼入場 <span class="tk-k">${k+1}</span>/${n}</b>${t.status==='active'?ticketPills(t):`<span class="pill gray">${esc(tkVoidText(t))}</span>`}</div>
          <div class="tk-holder">${t.guest?'<span class="pill gray">同行</span>':avatarHTML(S.me)}<b>${esc(t.holder||S.me.name)}</b></div>
          ${t.status==='active'&&t.qr?`<div class="ticket-qr ${t.checkedInAt||c.date<todayStr()?'used':''}">${qrSVG(t.qr)}<img class="qr-logo" src="${LOGO}" alt=""></div>
          <div class="ticket-code">票號 ${fmtTicket(t.ticketId)}</div>`:''}
          ${t.status==='active'&&!t.qr?`<div class="qr-wait"><div class="ic">⏳</div><b>等待確認付款</b><div>要繳 NT$${t.fee.toLocaleString()}</div>
            <div class="small">${esc(c.payInfo || (MYTK&&MYTK.payInfo) || '管理員確認收到款項後，這裡就會出現入場 QR。')}</div></div>`:''}
          ${live(t)?`<div class="row mt" style="justify-content:center;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" data-holder="${k}">✏️ 改使用人／轉讓</button>
            ${t.cancelReqAt?'':`<button class="btn btn-ghost btn-sm" data-cancel="${k}">${t.paidAt?'申請取消':'取消這張'}</button>`}</div>`:''}
        </div>`).join('')}
        <div class="hint center">入場時把螢幕調亮，直接給工作人員掃。一張 QR 只能入場一次。</div>
        ${opts.allowMore && c.date>=todayStr() && (!c.capacity||c.taken<c.capacity)?'<button class="btn btn-outline mt" data-more>＋ 加買同行票</button>':''}
        <div class="tk-order">
          <div><span>可轉讓票券</span><b>${ts.filter(live).length} 張</b></div>
          ${first?`<div><span>報名時間</span><b>${fmtShort(first)}</b></div>`:''}
          ${ts.some(t=>t.paidAt)?`<div><span>已繳費</span><b>NT$${ts.reduce((a,t)=>a+(t.paidAt?t.paidAmount:0),0).toLocaleString()}</b></div>`:''}
          ${ts.some(t=>t.status==='active'&&!t.paid)?`<div><span>還沒確認付款</span><b>NT$${ts.reduce((a,t)=>a+(t.status==='active'&&!t.paid?t.fee:0),0).toLocaleString()}</b></div>`:''}
        </div>
      </div></div>`;
  };
  draw();
  bg.addEventListener('click', async e=>{
    if (e.target===bg || e.target.closest('[data-x]')) return bg.remove();
    if (e.target.closest('[data-more]')){ bg.remove(); return courseRegister(c.id); }
    const h = e.target.closest('[data-holder]');
    if (h){
      const k = +h.dataset.holder, t = tickets[k];
      const name = await promptBox('這張票要給誰用？輸入他的名字。\n改了之後會換一個新的 QR，舊的（包括已經傳出去的截圖）就不能用了。', t.guest ? '' : t.holder, '改好了');
      if (!name) return;
      try { tickets[k] = await api.ticketHolder(t.ticketId, name); toast('已換成新的 QR，記得把新的傳給他','ok'); draw(); opts.onChange && opts.onChange(); }
      catch(err){ toast(errText(err),'err'); }
      return;
    }
    const cx = e.target.closest('[data-cancel]');
    if (cx){
      const k = +cx.dataset.cancel, t = tickets[k];
      const msg = t.paidAt ? '這張已經繳費了，要申請取消嗎？\n管理員會跟你聯絡退費或改到下一場。' : `確定取消「${t.holder}」這張票嗎？名額會讓給其他人。`;
      if (!await confirmBox(msg, t.paidAt?'申請取消':'取消這張', true)) return;
      try { const r = await api.courseCancel(t.ticketId);
        if (r.requested) { t.cancelReqAt = Date.now(); toast('已送出取消申請，等管理員處理','ok'); draw(); }
        else { tickets.splice(k,1); if (c.taken) c.taken--; toast('已取消'); if (!tickets.length) bg.remove(); else draw(); }
        opts.onChange && opts.onChange(); }
      catch(err){ toast(errText(err),'err'); }
    }
  });
  document.body.appendChild(bg);
}

/* ---------- 自己排圖示（2026-11-25 08:06 使用者：「讓使用者自己排列順序，像手機這樣可以自己排列和移動」）----------
   按住 0.5 秒（或按「↕ 排列圖示」）→ 圖示會抖動 → 拖到想放的位置；手不穩也可以「先點一個、再點要放的位置」。
   放好就存到後端（Members.tiles），換手機、LINE 裡或桌面圖示打開都一樣。 */
let tileSaveT = null;
function tileSave(){
  const g = $('#app-grid'); if (!g) return;
  const vis = [...g.querySelectorAll('.app-tile')].map(x=>x.dataset.key), full = tileOrder(); let i = 0;
  const order = full.map(k => vis.includes(k) ? vis[i++] : k);   // 沒顯示的（例如高鐵沒開放）留在原本的位置
  S.me.tiles = order; clearTimeout(tileSaveT);
  tileSaveT = setTimeout(()=>{ api.meTilesSet(order).catch(()=>toast('順序沒存到，請再排一次','err')); }, 700);
}
function tileEdit(on){
  const g = $('#app-grid'); if (!g) return;
  g.classList.toggle('editing', on); $('#tile-bar').classList.toggle('hidden', !on);
  const l = $('.tiles-edit-link'); if (l) l.classList.toggle('hidden', on);
  g.querySelectorAll('.picked').forEach(x=>x.classList.remove('picked'));
}
function initTileGrid(){
  const g = $('#app-grid'); if (!g) return;
  let press = null, drag = null, swallow = false;
  const tileAt = (x, y, skip) => [...g.querySelectorAll('.app-tile')].find(t => { if (t===skip) return false; const r = t.getBoundingClientRect(); return x>r.left && x<r.right && y>r.top && y<r.bottom; });
  const moveTo = (t, over) => { const all = [...g.querySelectorAll('.app-tile')]; if (all.indexOf(t) < all.indexOf(over)) over.after(t); else over.before(t); };
  // 排列時：點圖示不要打開、不要換頁
  g.addEventListener('click', e=>{ if (g.classList.contains('editing') || swallow) { e.preventDefault(); e.stopPropagation(); swallow = false; } }, true);
  g.addEventListener('contextmenu', e=>{ if (e.target.closest('.app-tile')) e.preventDefault(); });
  g.addEventListener('pointerdown', e=>{
    const t = e.target.closest('.app-tile'); if (!t) return;
    if (!g.classList.contains('editing')) {   // 按住 0.55 秒進入排列
      const x0 = e.clientX, y0 = e.clientY;
      press = { x0, y0, timer: setTimeout(()=>{ press = null; swallow = true; tileEdit(true); if (navigator.vibrate) navigator.vibrate(30); }, 550) };
      return; }
    drag = { t, x0:e.clientX, y0:e.clientY, dx:0, dy:0, moved:false };
    try { t.setPointerCapture(e.pointerId); } catch(_){}
  });
  g.addEventListener('pointermove', e=>{
    if (press && Math.hypot(e.clientX-press.x0, e.clientY-press.y0) > 10) { clearTimeout(press.timer); press = null; }
    if (!drag) return;
    const dx = e.clientX-drag.x0, dy = e.clientY-drag.y0;
    if (!drag.moved && Math.hypot(dx, dy) < 8) return;
    if (!drag.moved) { drag.moved = true; drag.t.classList.add('dragging'); g.querySelectorAll('.picked').forEach(x=>x.classList.remove('picked')); }
    e.preventDefault();
    const over = tileAt(e.clientX, e.clientY, drag.t);
    if (over) {   // 換位置：記住手指下的位置不要跳
      const b0 = drag.t.getBoundingClientRect(); moveTo(drag.t, over); const b1 = drag.t.getBoundingClientRect();
      drag.x0 += b1.left - b0.left; drag.y0 += b1.top - b0.top; }
    drag.t.style.transform = `translate(${e.clientX-drag.x0}px,${e.clientY-drag.y0}px) scale(1.1)`;
  });
  const end = e=>{
    if (press) { clearTimeout(press.timer); press = null; }
    if (!drag) return;
    const d = drag; drag = null; d.t.style.transform = ''; d.t.classList.remove('dragging');
    if (d.moved) { tileSave(); return; }
    // 沒拖：先點一個、再點要放的位置
    const picked = g.querySelector('.picked');
    if (!picked) d.t.classList.add('picked');
    else if (picked === d.t) picked.classList.remove('picked');
    else { picked.classList.remove('picked'); moveTo(picked, d.t); tileSave(); }
  };
  g.addEventListener('pointerup', end); g.addEventListener('pointercancel', end);
}
/** 設定：大頭照、我的徽章、基本資料、登入方式、登出、放到手機桌面 */
/* ---------- 走路計步（2026-11-27 14:02 使用者：「開著皇家一邊走路可以算幾步」「記錄步數、換算消耗的熱量」「我想要開著 APP 才會計算」「不填體重」）
   用手機的動作感應器（DeviceMotion）算步數：APP 開著、螢幕亮著才算；鎖螢幕或切到別的 APP 就停（網頁讀不到手機「健康」的步數）。
   熱量用一般人平均：每 1000 步約 40 大卡；距離：一步約 0.65 公尺。步數先存在這支手機（之後做團隊排行榜再上傳）。
   2026-11-27 17:21 開放給大家（原本試用中只有管理員看得到）。
   2026-11-27 15:32 使用者把「走路」取名「一起走走」（先做純走路；路線地圖、團隊排行榜之後再說）。 ---------- */
const WALK_KEY = 'royal_walk', KCAL_PER_STEP = 0.04, KM_PER_STEP = 0.00065, WALK_SYNC_MS = 120000;
const WALK = { on:false, got:false, wake:null, fast:null, slow:null, armed:true, last:0, streak:0, amp:0, peak:0, iv:0, bad:0, syncT:null, syncing:false };
/** 手機裡存：今天的步數（steps）、最近 30 天（hist）、已經送到後台的步數（sent）、按了「歸零」還沒送的日期（reset） */
function walkLoad(){
  const d = store(WALK_KEY) || {}, T = todayStr(), hist = { ...(d.hist || {}) }, sent = { ...(d.sent || {}) }, reset = d.reset || '';
  if (d.date === T) return { date:T, steps:+d.steps || 0, hist, sent, reset };
  if (d.date && d.steps) hist[d.date] = d.steps;   // 換天：昨天的收進紀錄
  return { date:T, steps:0, hist, sent, reset };
}
function walkSave(w){
  const keep = o => { const r = {}; Object.keys(o || {}).sort().slice(-30).forEach(k => { r[k] = o[k]; }); return r; };
  store(WALK_KEY, { date:w.date, steps:w.steps, hist:keep(w.hist), sent:keep(w.sent), reset:w.reset || '' });
}
/** 步數存到後台（2026-11-27 15:41 使用者：「讓使用者可以自行留存紀錄」「我後台也是可以留存，到時候就可以來做排行」）
 *  走路時每 2 分鐘送一次；按停下來、離開這一頁、切到別的 APP、APP 開著每 3 分鐘報到時也會送。沒網路就下次再送（最多補到 7 天前）。
 *  後台同一天只留比較多的步數（兩支手機各算各的）；按「歸零」才會改小。 */
function walkQueue(){ if (!WALK.syncT) WALK.syncT = setTimeout(() => { WALK.syncT = null; walkSync(); }, WALK_SYNC_MS); }
async function walkSync(){
  if (!S.session || WALK.syncing) return;
  const w = walkLoad(), all = { ...w.hist, [w.date]: w.steps }, oldest = addDays(w.date, -7);
  const days = Object.keys(all).filter(d => d >= oldest && (d === w.reset || (+all[d] || 0) > (+w.sent[d] || 0))).sort().reverse().slice(0, 8)
    .map(d => d === w.reset ? { date:d, steps:+all[d] || 0, reset:true } : { date:d, steps:+all[d] || 0 });
  if (!days.length) return;
  clearTimeout(WALK.syncT); WALK.syncT = null; WALK.syncing = true;
  try {
    await api.walkSave(days);
    const w2 = walkLoad();
    days.forEach(x => { w2.sent[x.date] = x.steps; if (x.reset && w2.reset === x.date) w2.reset = ''; });
    walkSave(w2);
  } catch(_) {}   // 沒網路：下次再送
  finally { WALK.syncing = false; }
}
/** 打開這一頁：從後台拿回自己最近 30 天（換手機、重裝也找得回來）；後台比較多就用後台的 */
async function walkPull(){
  if (!S.session) return;
  try {
    const r = await api.walkMine(), w = walkLoad(); let changed = false;
    Object.entries((r && r.days) || {}).forEach(([d, n]) => {
      n = +n || 0;
      if (d === w.date) { if (n > w.steps && w.reset !== d) { w.steps = n; changed = true; } }
      else if (d < w.date && n > (+w.hist[d] || 0)) { w.hist[d] = n; changed = true; }
      if (n > (+w.sent[d] || 0)) w.sent[d] = n;   // 後台已經有了，不用再送
    });

    if (changed && S.sub === 'walk') { drawWalkNums(w.steps); drawWalkDays(); }

}
/** 判斷一步：加速度大小（含重力，m/s²）快的平均減慢的平均，往上超過門檻算一步。
 *  2026-11-27 16:58 使用者：「有點敏感」（沒在走也會跳、走路也算太多）→ 改嚴格（電腦模擬：手上亂晃 10 秒從 16 步降到 0～1 步，走路、跑步、口袋裡一樣準）：
 *  1. 門檻跟著自己的步伐力道調（最近幾步最高點的 45%，至少 1.1），比較小的回彈、晃動不算。
 *  2. 兩步至少隔 0.33 秒，而且不能比平常的一步快太多（同一步的第二下、手抖不算）。
 *  3. 節奏要穩：連續 7 步、每步間隔差不多（±25～35%）才開始算（7 步一起加上去）；

const WALK_WARM = 7;
function walkSensorReset(){ Object.assign(WALK, { slow:null, fast:null, armed:true, last:0, streak:0, amp:0, peak:0, iv:0, bad:0 }); }
function stepFeed(mag, t){
  if (WALK.slow == null) { WALK.slow = WALK.fast = mag; return 0; }
  WALK.slow += (mag - WALK.slow) * 0.02; WALK.fast += (mag - WALK.fast) * 0.35;
  const sig = WALK.fast - WALK.slow, thr = Math.max(1.1, WALK.amp * 0.45);
  if (!WALK.armed) {   // 這一下還沒過：記最高點，掉下來才準備算下一步
    WALK.peak = Math.max(WALK.peak, sig);
    if (sig < thr * 0.2) { WALK.armed = true; WALK.amp = WALK.amp ? WALK.amp * 0.7 + WALK.peak * 0.3 : WALK.peak; }
    return 0;
  }
  if (sig < thr) return 0;
  WALK.armed = false; WALK.peak = sig;
  const d = t - WALK.last;
  if (WALK.last && d < Math.max(330, WALK.iv * 0.6)) return 0;   // 太快的第二下：不算
  WALK.last = t;
  if (!WALK.streak || d > 2000) { WALK.streak = 1; WALK.iv = 0; WALK.bad = 0; return 0; }   // 第一步（或停了 2 秒以上）：重新確認
  const warm = WALK.streak < WALK_WARM;
  if (WALK.iv && (d < WALK.iv * (warm ? 0.75 : 0.6) || d > WALK.iv * (warm ? 1.35 : 1.7))) {   // 節奏不對
    if (warm || ++WALK.bad >= 2) { WALK.streak = 1; WALK.iv = d; WALK.bad = 0; }
    return 0;
  }
  WALK.bad = Math.max(0, WALK.bad - 1);
  WALK.iv = WALK.iv ? WALK.iv * 0.7 + d * 0.3 : d;
  WALK.streak++;
  return WALK.streak === WALK_WARM ? WALK_WARM : WALK.streak > WALK_WARM ? 1 : 0;

function onWalkMotion(e){

const walkDist = n => { const km = n * KM_PER_STEP; return km < 1 ? Math.round(km * 100) * 10 + ' 公尺' : km.toFixed(1) + ' 公里'; };

let HS_TIMER = null;
function startHonorAuto(){
  clearInterval(HS_TIMER);
  const el = $('#hs-track'); if (!el) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let stop = false; const halt = () => { stop = true; };
  ['touchstart','pointerdown','wheel','keydown'].forEach(ev => el.addEventListener(ev, halt, {passive:true}));
  HS_TIMER = setInterval(() => {
    if (!document.body.contains(el)) return clearInterval(HS_TIMER);
    if (stop || document.hidden) return;
    const c = el.firstElementChild, max = el.scrollWidth - el.clientWidth; if (!c || max < 8) return;
    const step = c.offsetWidth + 10;
    el.scrollTo({ left: el.scrollLeft + step > max + 4 ? 0 : el.scrollLeft + step, behavior: 'smooth' });
  }, 3500);
}

  else body = `<div class="card"><h2 class="act-name">確認報名</h2>

async function setUpline(memberId, o={}){

  const sug = hint ? [...ms.filter(u=>u.name===hint), ...ms.filter(u=>u.name!==hint && hint.length>=2 && u.name.length>=2 && (u.name.includes(hint) || hint.includes(u.name)))].slice(0,3) : [];

    if (e.target===bg || e.target.closest('[data-x]')) return bg.remove();
    const b = e.target.closest('[data-up]'); if (!b || b.disabled) return;
    b.disabled = true;

  });

}

const TV_WAYS = { paper:{s:'紙本',l:'紙本刷卡單',got:'紙本刷卡單收到了'}, ecard:{s:'電子',l:'電子刷卡單',got:'電子刷卡單收到了'}, transfer:{s:'轉帳',l:'轉帳',got:'轉帳收到了'},

const tvW = (w, item) => { const o = item && item.wl && item.wl[w]; return o ? { s:o[0], l:o[1], got:o[1]+'記好了' } : (TV_WAYS[w] || TV_WAYS.doc); };   // 這一項自己的叫法（例如瑞士尾款：原卡授權、換卡授權書）

const tvMembers = no => TV.board ? TV.board.people.filter(p=>{ const r = TV.recs[p.no]; return r && r.withNo===no; }).map(p=>p.no) : [];

function drawTvBoard(){
  const box = $('#tv-board'); if (!box) return;
  if (!TV.board) { box.innerHTML = ''; return; }
  const b = TV.board, doc = !b.item.ways.length, got = b.people.filter(p=>TV.recs[p.no]), sum = got.reduce((s,p)=>s + TV.recs[p.no].amount, 0);
  const busNos = [...new Set(b.people.map(p=>p.bus))].sort((x,y)=>x-y);

    const packs = []; list.forEach(p=>{ const l = packs[packs.length-1]; if (p.group && l && l.g===p.group) l.ps.push(p); else packs.push({ g:p.group, ps:[p] }); });

      return `<div class="tv-col${n===TV.bus?' on':''}"><button type="button" class="tv-bus" data-tv="bus" data-bus="${n}" aria-pressed="${n===TV.bus}"><b>${esc(tvBusName(n))}</b><span>${g}／${ps.length}${ps.length>g?`　差 ${ps.length-g}`:'　收齊'}</span></button>
        <div class="tv-names">${names(ps)}</div></div>`; }).join('')}</div>
    ${special.length ? `<div class="card tv-extra"><h3>要注意的（${special.length}）</h3>${special.map(p=>{ const r = TV.recs[p.no];

/* 點名字後跳出來選怎麼給（掛在最外層，位置跟著名字） */

/* ---------- 收件：先讓畫面變綠＋出聲（不用等網路），後台沒存到再退回 ---------- */
async function tvReceive(no, way){
  const p = tvPerson(no); if (!p || !TV.board) return;
  const trip = TV.trip, item = TV.item;
  if (TV.recs[no]) { beepDup(); TV.bus = p.bus; return tvSetLast({ kind:'dup', no, name:p.name, title:'已經收過了', sub: tvBusName(p.bus)+'・'+tvTime(TV.recs[no].at) }); }
  const tmp = { id:'', item, no, method:way, amount: TV.board.item.ways.length ? p.amount : 0, base: TV.board.item.ways.length ? p.amount : 0, note:'', withNo:'', auto:false, at:tvNow(), pending:true };
  TV.recs[no] = tmp; TV.bus = p.bus; beepOk();
  tvSetLast({ kind:'ok', no, name:p.name, title:tvW(way, TV.board.item).got, sub: tvBusName(p.bus)+'・'+tvTime(tmp.at) });
  try {
    const r = await api.adminTravelReceive(trip, item, no, way);
    if (TV.trip!==trip || TV.item!==item) return;
    TV.recs[no] = r.rec;
    if (r.result==='dup') { beepDup(); if (TV.last && TV.last.no===no) TV.last = { kind:'dup', no, name:p.name, title:'已經收過了', sub: tvBusName(p.bus)+'・'+tvTime(r.rec.at) }; }
  } catch(e) {
    if (TV.trip!==trip || TV.item!==item) return;
    if (TV.recs[no]===tmp) delete TV.recs[no];
    beepErr(); TV.last = { kind:'bad', name:p.name, title:'沒有存到', sub:'請再點一次。一直失敗的話，先用紙本打勾。' };
  }
  drawTvBoard();
}
async function tvSave(){
  const no = TV.last && TV.last.no, r = no && TV.recs[no]; if (!r || !r.id) return;
  const raw = ($('#tv-amt') || {}).value || '', note = (($('#tv-note') || {}).value || '').trim(), amt = raw.replace(/[,，\s元$＄]/g,'');
  if (!/^\d+$/.test(amt)) return tvMsg('金額請填數字');
  if (/(?:\d[\s-]*){12,}/.test(note)) return tvMsg('細項看起來有卡號，這裡不要寫卡號');
  tvMsg('存檔中…');
  try { const x = await api.adminTravelEdit(r.id, { amount:+amt, note }); TV.recs[no] = x.rec; TV.dirty = null; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); drawTvBoard(); tvMsg('已儲存：'+tvMoney(x.rec.amount)+' 元'); }
  catch(e){ tvMsg('沒有存到：'+errText(e)); }
}
async function tvSetWay(w){
  const no = TV.last && TV.last.no, r = no && TV.recs[no]; if (!r || !r.id || r.method===w) return;
  const keep = TV.dirty; tvMsg('存檔中…');
  try { const x = await api.adminTravelEdit(r.id, { method:w }); TV.recs[no] = x.rec; drawTvBoard(); TV.dirty = keep; tvMsg('已改成：'+tvW(w, TV.board.item).l); }
  catch(e){ tvMsg('沒有存到，請再按一次'); }
}
async function tvUndo(){
  const no = TV.last && TV.last.no, r = no && TV.recs[no], p = tvPerson(no); if (!r || !r.id || !p) return;
  const joined = tvMembers(no).length;
  if (joined) return tvMsg(`還有 ${joined} 人跟他一起刷，請先按「一起刷」把他們點掉`);
  TV.dirty = null; delete TV.recs[no];
  tvSetLast({ kind:'idle', title:'已取消：'+p.name, sub: TV.board.item.ways.length ? '這張單子現在算還沒收' : '現在算還沒收' });
  try { const x = await api.adminTravelUndo(r.id); if (x.result==='hasMembers') { TV.recs[no] = r; tvSetLast({ kind:'bad', no, name:p.name, title:'還有人跟他一起刷', sub:'請先把他們點掉' }); } }
  catch(e){ TV.recs[no] = r; tvSetLast({ kind:'bad', no, name:p.name, title:'沒有取消成功', sub:'請再按一次復原' }); }
}
/* 一起刷：先點已收的那一位 → 按「一起刷」→ 再點家人的名字（點錯再點一次取消） */
function tvLinkStatus(warn){
  const head = TV.link, ms = tvMembers(head);
  TV.last = { kind: warn ? 'dup' : 'ok', name: tvName(head), title: warn || '一起刷：再點家人的名字，點錯再點一次取消',
    sub: ms.length ? `已選：${ms.map(tvName).join('、')}（${ms.length+1} 人，共 ${tvMoney(tvGroupSum(head))} 元）` : '還沒選人', link:true };
  drawTvBoard();
}
function tvFinishLink(){ const head = TV.link; TV.link = null; if (head && TV.recs[head]) tvOpenRec(head); else { TV.last = null; drawTvBoard(); } }
async function tvToggleMember(no){
  const head = TV.link, h = TV.recs[head]; if (!h) return tvFinishLink();
  if (no===head) return tvFinishLink();
  const r = TV.recs[no], keep = r ? {...r} : null;
  if (r && r.withNo!==head && (r.withNo || tvMembers(no).length)) { beepErr(); return tvLinkStatus(tvName(no)+' 已經在別組一起刷，要改先把那一組取消'); }
  if (r && r.withNo===head) { if (r.auto) delete TV.recs[no]; else TV.recs[no] = { ...r, withNo:'' }; }
  else if (r) TV.recs[no] = { ...r, withNo:head };
  else { const p = tvPerson(no); TV.recs[no] = { id:'', item:TV.item, no, method:h.method, amount:p.amount, base:p.amount, note:'', withNo:head, auto:true, at:tvNow(), pending:true }; beepOk(); }
  tvLinkStatus();
  try {
    const x = await api.adminTravelWith(TV.trip, TV.item, head, no);
    if (x.result==='busy') throw new Error('BUSY_GROUP');
    const b = await api.adminTravelBoard(TV.trip, TV.item);   // 拿回正式的紀錄（有編號才能改、能復原）
    if (b.trip.id===TV.trip && b.item.k===TV.item) { TV.board = b; TV.recs = {}; b.recs.forEach(y=>{ TV.recs[y.no] = y; }); }
  } catch(e) {
    if (keep) TV.recs[no] = keep; else delete TV.recs[no];
    beepErr(); return tvLinkStatus(e.message==='BUSY_GROUP' ? tvName(no)+' 已經在別組一起刷' : '沒有存到，請再點一次');
  }
  if (TV.link===head) tvLinkStatus();
}

/* ---------- 掃描槍：讀實體按鍵（中文輸入法開著也掃得到）；刷卡單條碼（W001）或會員卡 ---------- */
const TVGUN = { buf:'', t:0 };
document.addEventListener('keydown', e=>{
  if (S.sub!=='adminTravel' || !TV.board) return;
  if (e.key==='Escape') { if (TV.link) tvFinishLink(); if (TV.pick) tvClosePicker(); return; }
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  const c = e.code || ''; let ch = '';
  if (/^Key[A-Z]$/.test(c)) ch = c.slice(3); else if (/^Digit[0-9]$/.test(c)) ch = c.slice(5); else if (/^Numpad[0-9]$/.test(c)) ch = c.slice(6);
  else if (c==='Period' || c==='NumpadDecimal') ch = '.'; else if (c==='Minus' || c==='NumpadSubtract') ch = '-';
  else if (c==='Enter' || c==='NumpadEnter') {
    const v = TVGUN.buf; TVGUN.buf = '';
    if (/^[A-Z]\d{1,4}$/.test(v) || /^RM1[.:]/.test(v)) { e.preventDefault(); e.stopPropagation(); tvScan(v); }
    return;
  } else return;
  const now = performance.now(); if (now - TVGUN.t > 300) TVGUN.buf = ''; TVGUN.t = now; TVGUN.buf += ch;
}, true);
async function tvScan(code){
  if (TV.pick) tvClosePicker();
  if (TV.link) { const m0 = code.match(/^([A-Z])(\d{1,4})$/), p0 = m0 && m0[1]===TV.item && tvPerson(m0[2]); if (p0) return tvToggleMember(p0.no); beepErr(); return tvLinkStatus('一起刷時，請點家人的名字'); }
  const m = code.match(/^([A-Z])(\d{1,4})$/);
  if (m) {
    if (m[1]!==TV.item) { const it = TV.board.trip.items.find(i=>i.k===m[1]); beepErr();
      return tvSetLast({ kind:'bad', title:`這不是${TV.board.item.t}的條碼`, sub: it ? `${code} 是${it.t}的條碼，請先切到「${it.t}」` : '掃到的是 '+code }); }
    const p = tvPerson(m[2]);
    if (!p) { beepErr(); return tvSetLast({ kind:'bad', title:'名單上沒有這個條碼', sub:'掃到的是 '+code }); }
    return tvReceive(p.no, tvDefaultWay());
  }
  const trip = TV.trip, item = TV.item;
  let r; try { r = await api.adminTravelScan(trip, item, code); } catch(e){ beepErr(); return tvSetLast({ kind:'bad', title:'沒有存到', sub:'請再掃一次' }); }
  if (TV.trip!==trip || TV.item!==item) return;
  if (r.result==='ok' || r.result==='dup') { TV.recs[r.no] = r.rec; const p = tvPerson(r.no) || { bus:1, name:r.name }; TV.bus = p.bus;
    if (r.result==='ok') beepOk(); else beepDup();
    return tvSetLast({ kind: r.result==='ok' ? 'ok' : 'dup', no:r.no, name:p.name, title: r.result==='ok' ? tvW(r.rec.method, TV.board.item).got : '已經收過了', sub: tvBusName(p.bus)+'・'+tvTime(r.rec.at) }); }
  beepErr();
  tvSetLast({ kind:'bad', name:r.name || '', title: r.result==='notOnTrip' ? '不在這一團的名單上' : r.result==='skip' ? '這位不用交這一項' : '看不懂這個條碼', sub: r.result==='invalid' ? '掃到的是 '+(r.code||'') : '' });
}

async function tvClick(e){
  const el = e.target.closest('[data-tv]'); if (!el) return;
  const a = el.dataset.tv;
  if (a==='flag') {
    const on = el.dataset.on==='1';
    if (!await confirmBox(on ? '開放給夥伴看？\n夥伴在「旅遊」會看到自己交了什麼。' : '關掉？\n夥伴就看不到自己交了什麼（紀錄都還在）。', on ? '開放' : '關掉', !on)) return;
    try { await api.adminSettingSet('travelRecvOn', on ? 'Y' : 'N'); if (S.me) S.me.travelRecv = on; toast(on ? '已開放給夥伴看' : '已關掉', 'ok'); renderAdminTravel($('#main')); } catch(err){ toast(errText(err), 'err'); }
    return;
  }
  if (a==='trip' || a==='item') {
    if (a==='trip') { if (TV.trip===el.dataset.id) return; TV.trip = el.dataset.id; TV.item = ''; } else { if (TV.item===el.dataset.k) return; TV.item = el.dataset.k; }
    TV.board = null; TV.recs = {}; TV.last = null; TV.link = null; TV.dirty = null; tvClosePicker();
    $('#main').querySelectorAll(`[data-tv="${a}"]`).forEach(b=>b.classList.toggle('on', b===el));
    if (a==='trip') return renderAdminTravel($('#main'));
    return tvLoadBoard();
  }
  if (a==='people') { tvClosePicker(); return go('account', {sub:'adminTravelPeople'}); }
  if (a==='hide') {
    const hide = el.dataset.on==='1';
    if (!await confirmBox(hide ? '把這一團藏起來？\n夥伴就看不到這一團（資料不會刪）。' : '打開這一團？\n名單上對到的夥伴，會看到自己交了什麼。', hide ? '藏起來' : '打開')) return;
    try { await api.adminTravelTrip(TV.trip, hide); renderAdminTravel($('#main')); } catch(err){ toast(errText(err), 'err'); }
    return;
  }
  if (!TV.board) return;
  if (a==='bus') { TV.bus = +el.dataset.bus; return drawTvBoard(); }
  if (a==='p') {
    const no = el.dataset.no;
    if (TV.link) return tvToggleMember(no);
    if (TV.recs[no]) { if (TV.pick) { TV.pick = null; const pk = $('#tv-picker'); if (pk) pk.remove(); } if (TV.recs[no].pending) return; return tvOpenRec(no); }
    if (!TV.board.item.ways.length) return tvReceive(no, 'doc');
    if (TV.pick===no) return tvClosePicker();
    return tvOpenPicker(no, el);
  }
  if (a==='open') { const no = el.dataset.no; if (TV.link || !TV.recs[no]) return; tvOpenRec(no); window.scrollTo(0, 0); return; }
  if (a==='link-done') return tvFinishLink();
  if (a==='way') return tvSetWay(el.dataset.w);
  if (a==='together') { const no = TV.last && TV.last.no, r = no && TV.recs[no]; if (!r || !r.id) return;
    if (r.withNo) { tvMsg('存檔中…'); try { const x = await api.adminTravelEdit(r.id, { unwith:true }); TV.recs[no] = x.rec; drawTvBoard(); tvMsg('已取消一起刷，這筆還是算已收'); } catch(err){ tvMsg('沒有存到，請再按一次'); } return; }
    TV.link = no; return tvLinkStatus(); }
  if (a==='save') return tvSave();
  if (a==='undo') return tvUndo();
}

function rosterCSV(){
  const rows = rosterPick(), d = ROSTER, FS = { paid:'已繳', pending:'等確認', exempt:'免繳', trial:'試用期', none:'還沒繳' };
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"';
  const lines = [['姓名','TW 帳號','上線','哪條線','第幾代','直接下線人數',monthZh(d.month)+'月費','參加的班','加入日期','狀態'].map(q).join(',')]
    .concat(rows.map(r=>[r.name, r.tw, r.upName || (r.upText?'（申請寫）'+r.upText:''), r.headName, r.depth||'', r.downs, r.status==='pending'?'':FS[r.fee]||r.fee, r.acts.join('、'), r.joined, r.status==='pending'?'等審核':''].map(q).join(',')));
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `夥伴總表_${todayStr()}.csv`; a.click();

}

async function adminTreeSheet(){
  let d; try { d = await api.adminTree(); } catch(err){ return toast(errText(err),'err'); }
  let kids, total, roots, heads, loners;
  const cnt = id => { if (total[id] != null) return total[id]; total[id] = 0; let n = 0; (kids[id]||[]).forEach(c=>{ n += 1 + cnt(c.id); }); return total[id] = n; };
  const byName = (a,b) => a.name.localeCompare(b.name, 'zh-Hant'), order = (a,b) => (cnt(b.id)-cnt(a.id)) || byName(a,b);
  const rebuild = () => { kids = {}; total = {};
    d.members.forEach(m=>{ (kids[m.up||''] = kids[m.up||''] || []).push(m); });
    roots = kids[''] || []; heads = roots.filter(m=>(kids[m.id]||[]).length).sort(order); loners = roots.filter(m=>!(kids[m.id]||[]).length).sort(byName); };
  rebuild();
  const open = new Set(heads.map(h=>h.id));   // 一開始：每條線展開第 1 代
  const bg = document.createElement('div'); bg.className='sheet-bg';
  const node = (m, depth, seen) => {
    if (seen.has(m.id)) return ''; seen.add(m.id);
    const ch = (kids[m.id]||[]).slice().sort(order), on = open.has(m.id);
    return `<div class="tree-node" style="padding-left:${Math.min(depth-1,7)*18}px">${ch.length?`<button class="tg" data-tg="${m.id}" aria-label="${on?'收起':'展開'}">${on?'▾':'▸'}</button>`:'<span class="tg"></span>'}
      <button class="nm" data-mem="${m.id}">${avatarHTML(m)}<span class="uc">${esc(m.name)}</span>${badgeHTML(m.id)}<span class="gen">第 ${depth} 代</span></button>${ch.length?`<span class="cnt">下面 ${cnt(m.id)} 人</span>`:''}</div>
      ${on ? ch.map(c=>node(c, depth+1, seen)).join('') : ''}`;
  };
  const draw = () => {
    const seen = new Set(), body = $('.sheet-b', bg) || null, top = body ? body.scrollTop : 0;
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3>🌳 團隊樹狀圖</h3><button data-x>關閉</button></div>
      <div class="sheet-b"><div class="tree-sum"><span class="pill brand">${heads.length} 條線</span><span class="pill gray">共 ${d.members.length} 人</span>${loners.length?`<span class="pill pend">還沒分線 ${loners.length} 人</span>`:''}</div>
        <div class="row mb" style="flex-wrap:wrap"><button class="btn btn-outline btn-sm" data-all="1">全部展開</button><button class="btn btn-outline btn-sm" data-all="0">全部收起</button></div>
        <div class="muted small mb">點 ▸ 展開下線；點名字可以看他的資料、改上線。</div>
        ${heads.length ? heads.map(h=>{ seen.add(h.id); const on = open.has(h.id), ch = (kids[h.id]||[]).slice().sort(order);
          return `<div class="tree-line"><div class="tree-head"><button class="tg" data-tg="${h.id}" aria-label="${on?'收起':'展開'}">${on?'▾':'▸'}</button>
            <button class="nm" data-mem="${h.id}">${avatarHTML(h)}<b class="uc">${esc(h.name)}</b>${badgeHTML(h.id)}</button><span class="cnt">下面 ${cnt(h.id)} 人</span></div>
            ${on ? ch.map(c=>node(c, 1, seen)).join('') : ''}</div>`; }).join('') : '<div class="notice info">還沒有人設定上下線。</div>'}
        ${loners.length ? `<div class="card mt" id="tree-loners" style="box-shadow:none;border:1px solid var(--line)"><h3>還沒設定上線（${loners.length} 人）</h3><div class="muted small mb">點名字，直接選他的上線；<br>設好會留在這裡，可以接著設下一位。<br>最上面的頭不用設。</div>
          <div class="mlist">${loners.map(m=>`<div class="mrow">${avatarHTML(m)}<button class="info tree-set" data-setup="${m.id}"><b>${esc(m.name)}</b>${m.upText?`<div class="muted small">申請時寫的上線：${esc(m.upText)}</div>`:''}<div class="small" style="color:var(--brand);font-weight:700">👥 點這裡設定上線</div></button><button class="btn btn-ghost btn-sm" data-mem="${m.id}">資料</button></div>`).join('')}</div></div>` : ''}
      </div></div>`;
    const nb = $('.sheet-b', bg); if (nb) nb.scrollTop = top;
  };
  bg.addEventListener('click', e=>{
    if (e.target===bg || e.target.closest('[data-x]')) { bg.remove(); return; }
    const tg = e.target.closest('[data-tg]'); if (tg) { const id = tg.dataset.tg; open.has(id) ? open.delete(id) : open.add(id); draw(); return; }
    const all = e.target.closest('[data-all]'); if (all) { open.clear(); if (all.dataset.all==='1') d.members.forEach(m=>{ if ((kids[m.id]||[]).length) open.add(m.id); }); draw(); return; }
    const su = e.target.closest('[data-setup]');
    if (su) { const m = d.members.find(x=>x.id===su.dataset.setup); if (!m) return;   // 在樹狀圖裡直接設定上線，設完留在這裡（2026-11-25 使用者）
      setUpline(m.id, { name:m.name, hint:m.upText, members:d.members, onDone: async () => {
        try { d = await api.adminTree(); rebuild(); draw(); const L = $('#tree-loners', bg); if (L) L.scrollIntoView({block:'start'}); } catch(err){ toast(errText(err),'err'); } } });
      return; }
    const mb = e.target.closest('[data-mem]'); if (mb) { bg.remove(); S.admin.memberId = mb.dataset.mem; S.admin.calMonth = null; S.admin.calSel = null; go('account', {sub:'adminMember'}); }
  });
  document.body.appendChild(bg); draw();

const SCAN = { on:false, stream:null, busy:false, last:'', lastAt:0, timer:null, detector:null, canvas:null, inCount:0 };

async function startCamera(){
  const msg = $('#sc-msg'), video = $('#sc-video');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('NO_CAM');
    SCAN.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }, audio:false });
    if (!SCAN.on) return stopCamera();
    video.srcObject = SCAN.stream; await video.play(); msg.textContent = '';
    if ('BarcodeDetector' in window){ try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) SCAN.detector = new BarcodeDetector({formats:['qr_code']}); } catch(_){} }
    if (!SCAN.detector) await loadScript('vendor/jsQR.js');
    scanLoop();
  } catch(e){
    msg.innerHTML = e && e.name==='NotAllowedError' ? '相機沒有被允許。<br>請到瀏覽器設定允許相機，或用下面輸入票號。' : '這裡打不開相機。<br>用掃描槍直接掃就好；<br>或用手機的 Chrome／Safari 打開 APP 用鏡頭掃。';
  }
}
/* 掃描槍＝一個鍵盤。讀實體鍵位（e.code），中文輸入法開著也不會亂碼（做法同出貨核對） */
const GUN = { buf:'', t:0 };
function gunKeydown(e){
  if (!SCAN.on) return;
  const tag = e.target && e.target.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA') return;          // 讓人正常打字（手動輸入票號）
  const c = e.code; let ch = '';
  if (/^Key[A-Z]$/.test(c)) ch = c.slice(3);
  else if (/^Digit[0-9]$/.test(c)) ch = c.slice(5);
  else if (/^Numpad[0-9]$/.test(c)) ch = c.slice(6);
  else if (c==='Semicolon') ch = ':';
  else if (c==='Minus' || c==='NumpadSubtract') ch = '-';
  else if (c==='Enter' || c==='NumpadEnter'){
    e.preventDefault();
    const v = GUN.buf.trim(); GUN.buf = '';
    if (v.length >= 2) gunScan(v);
    return;
  } else return;
  const now = Date.now();
  if (now - GUN.t > 400) GUN.buf = '';                       // 間隔太久＝新的一次掃描
  GUN.t = now; GUN.buf += ch; e.preventDefault();
}
function gunScan(code){
  const res = $('#scan-res');
  if (res){
    if (res.querySelector('[data-sr]')){ beepErr(); toast('請先處理畫面上這位的繳費','err'); return; }
    if (res.classList.contains('wait')) return;
    res.remove(); SCAN.busy = false;                         // 上一位的結果還在：直接換下一位
  }
  if (SCAN.busy) return;
  scanHandle(code);
}
function stopCamera(){ if (SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; } clearTimeout(SCAN.timer); }
async function scanLoop(){
  if (!SCAN.on) return;
  const video = $('#sc-video');
  if (!SCAN.busy && video && video.readyState >= 2){
    try {
      let code = null;
      if (SCAN.detector){ const r = await SCAN.detector.detect(video); if (r.length) code = r[0].rawValue; }
      else if (window.jsQR){
        const w = video.videoWidth, h = video.videoHeight, k = Math.min(1, 720/Math.max(w,h));
        const cv = SCAN.canvas || (SCAN.canvas = document.createElement('canvas')); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
        const g = cv.getContext('2d', {willReadFrequently:true}); g.drawImage(video, 0, 0, cv.width, cv.height);
        const r = jsQR(g.getImageData(0,0,cv.width,cv.height).data, cv.width, cv.height, {inversionAttempts:'dontInvert'}); if (r) code = r.data;
      }
      if (code && !(code===SCAN.last && Date.now()-SCAN.lastAt < 4000)) await scanHandle(code);   // 同一張還在鏡頭前，不重複判斷
    } catch(_){}
  }
  SCAN.timer = setTimeout(scanLoop, 150);
}
async function scanHandle(code, payNow, method){
  SCAN.busy = true; SCAN.last = code; SCAN.lastAt = Date.now();
  showScanResult('wait', '<div class="spinner" style="width:48px;height:48px"></div><div class="sub mt">確認中…</div>');
  let r;
  try { r = await api.adminCheckin(S.admin.courseId, code, payNow, method); }
  catch(e){ beepErr(); return showScanResult('bad', `<div class="big">!</div><h2>網路不穩</h2><div class="sub">沒有確認成功，請再掃一次</div>`, 3000); }
  const who = r.member ? (r.member.guest
    ? `<div class="who">${esc(r.member.holder)}</div><div class="sub">${esc(r.member.name)} 的同行</div>`
    : `<div class="who">${avatarHTML(r.member,'lg')}${esc(r.member.holder||r.member.name)}</div>`) : '';
  if (r.result==='ok'){
    beepOk(); SCAN.inCount++; const n=$('#sc-n'); if (n) n.textContent = SCAN.inCount;
    return showScanResult('ok', `<div class="big">✓</div><h2>歡迎入場</h2>${who}<div class="sub">${r.paidNow?`已登記現場收款 NT$${r.fee.toLocaleString()}（${method==='transfer'?'轉帳':'現金'}）`:r.fee?'已繳費':'免費課程'}</div>`, 1800);
  }
  if (r.result==='already'){ beepDup();
    return showScanResult('warn', `<div class="big">!</div><h2>已經入場過了</h2>${who}<div class="sub">第一次入場：${hhmm(r.at)}</div>`, 3500); }
  beepErr();
  if (r.result==='unpaid') return showScanResult('bad', `<div class="big">✗</div><h2>尚未繳費</h2>${who}<div class="sub">要繳 NT$${r.fee.toLocaleString()}</div>
    <div class="acts"><button data-sr="cash">💵 現場收現金並入場</button><button data-sr="transfer">🏦 已確認轉帳，讓他入場</button><button class="alt" data-sr="no">先不要入場</button></div>`, 0, code);
  if (r.result==='replaced') return showScanResult('bad', `<div class="big">✗</div><h2>這張 QR 已經轉讓</h2>${who}<div class="sub">請對方打開最新的入場 QR（舊截圖不能用）</div>`, 4000);
  if (r.result==='cancelled') return showScanResult('bad', `<div class="big">✗</div><h2>這張票已取消／退費</h2>${who}`, 4000);
  if (r.result==='moved') return showScanResult('bad', `<div class="big">✗</div><h2>這張票已改到別堂課</h2>${who}<div class="sub">請對方用新的入場 QR</div>`, 4000);
  if (r.result==='no_ticket') return showScanResult('bad', `<div class="big">✗</div><h2>沒有報名這堂課</h2>${who}<div class="sub">掃的是會員卡，但他沒有這堂課的票</div>`, 3500);
  if (r.result==='wrong_course') return showScanResult('bad', `<div class="big">✗</div><h2>不是這堂課的票</h2>${who}<div class="sub">${r.courseTitle?'這張是：'+esc(r.courseTitle):''}</div>`, 3500);
  return showScanResult('bad', `<div class="big">✗</div><h2>看不懂這張 QR</h2><div class="sub">請夥伴打開 APP 的入場 QR 或「會員卡」再掃一次</div>`, 3000);
}
function showScanResult(kind, html, autoMs, code){
  let el = $('#scan-res'); if (el) el.remove();
  el = document.createElement('div'); el.className = 'scan-res '+kind; el.id='scan-res';
  el.innerHTML = html + (kind==='wait' || code ? '' : '<div class="tap">點一下畫面繼續掃描</div>');
  document.body.appendChild(el);
  if (kind==='wait') return;
  const done = ()=>{ if (!el.isConnected) return; el.remove(); SCAN.busy=false; SCAN.lastAt=Date.now(); };
  if (autoMs) setTimeout(done, autoMs);
  el.addEventListener('click', e=>{
    const b = e.target.closest('[data-sr]');
    if (code){ if (!b) return; if (b.dataset.sr==='no') return done(); el.remove(); scanHandle(code, true, b.dataset.sr); return; }
    done();
  });
}
function scanClick(e){
  const b = e.target.closest && e.target.closest('[data-sc]'); if (!b) return;
  const k = b.dataset.sc;
  if (k==='close'){ SCAN.on=false; stopCamera(); document.removeEventListener('keydown', gunKeydown, true); $('#scan').remove(); const r=$('#scan-res'); r&&r.remove(); document.body.style.overflow=''; (ADMC&&ADMC.staff ? renderStaffScan : renderAdminCourse)($('#main')); return; }
  if (SCAN.busy) return;
  if (k==='manual'){ const v = $('#sc-code').value.trim(); if (!v) return toast('請輸入票號'); $('#sc-code').value=''; $('#sc-code').blur(); return scanHandle(v.toUpperCase().replace(/[^A-Z0-9:]/g,'')); }
  // 示範：從名單挑一張
  const pool = ADMC.tickets.filter(t=>!t.checkedInAt);
  let t = null;
  if (k==='demo-paid') t = pool.find(x=>x.paid && !x.__used) || pool.find(x=>x.paid);
  if (k==='demo-unpaid') t = pool.find(x=>!x.paid && !x.__used) || pool.find(x=>!x.paid);
  if (k==='demo-again') t = SCAN.lastDemo;
  if (k==='demo-bad') return scanHandle('https://example.com/not-a-ticket');
  if (!t){ toast(k==='demo-again'?'先模擬掃一位':'名單裡沒有這種人了'); return; }
  t.__used = true; SCAN.lastDemo = t; scanHandle(t.qr);
}

/* ---------- 啟動 ---------- */
/** LINE 確認完帶回來的 code／state。LINE 把網址開在 LIFF 視窗時，原本的 ?code=…&state=… 會被包進 liff.state
 *  （2026-11-25 18:25 使用者：加了 LIFF 之後，主畫面的皇家按 LINE 登入一直「等候 LINE 確認」，LINE 轉到 LINE 裡的皇家畫面）。 */
function lineReturnParams(){
  const top = new URLSearchParams(location.search);
  const ok = q => (q.get('code') || q.get('error')) && q.get('state') && !q.has('liffClientId');
  if (ok(top)) return top;
  const ls = top.get('liff.state');
  if (ls) { const i = ls.indexOf('?'), inner = new URLSearchParams(i >= 0 ? ls.slice(i + 1) : ls); if (ok(inner)) return inner; }
  const h = location.hash.replace(/^#/, '');
  if (/(^|&)code=/.test(h) && /(^|&)state=/.test(h)) { const hq = new URLSearchParams(h); if (ok(hq)) return hq; }
  return null;
}
(async function start(){
  const params = new URLSearchParams(location.search);
  try {   // 被手機桌面的皇家叫起來（?pair=…，LIFF 會包在 liff.state 裡）：記下來，登入後問他要不要幫桌面的皇家登入
    let pv = params.get('pair'); const ls = params.get('liff.state');
    if (!pv && ls) { const i = ls.indexOf('?'); pv = new URLSearchParams(i >= 0 ? ls.slice(i + 1) : ls).get('pair'); }
    if (pv && /^[\w-]{16,80}$/.test(pv) && inLineApp()) sessionStorage.setItem('royal_pair', JSON.stringify({ p:pv, at:Date.now() }));
  } catch(_){}
  if (params.get('install') === '1') {   // 從 LINE 按「用 Safari 打開，教我放」過來：網址先清乾淨（放到桌面才不會帶參數），再直接出現放桌面的步驟
    params.delete('install'); params.delete('openExternalBrowser');
    history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
    if (CONFIG.MODE==='live' && !isStandalone() && !inLineApp()) setTimeout(() => { store('royal_install_tip', Date.now()); openInstallGuide(true); }, 600);
  }
  const lr = CONFIG.MODE==='live' ? lineReturnParams() : null;
  if (lr) return handleLineReturn(lr);
  const pend = store('royal_line_pending');
  if (CONFIG.MODE==='live' && pend && Date.now() - pend.at < 15*60000) return pollLine(pend);
  const sess = store(SESSION_KEY);
  if (!(sess && sess.expiresAt > Date.now()) && liffWanted()) {   // 在 LINE 裡打開、還沒登入：直接用 LINE 的身分登入
    if (await liffLogin()) return;
    return renderLogin('start');
  }
  if (sess && sess.expiresAt > Date.now()) {
    S.session = sess;
    const last = CONFIG.MODE==='live' ? store('royal_home_last') : null;
    if (last && last.me) {   // 秒開：先用上一次的首頁，背景再更新
      applyHome(last); api._prefetch = { at:Date.now(), feed:last.feed };
      document.body.style.background=''; renderShell(); goStart();
      const before = JSON.stringify(last);
      loadHome().then(() => {
        setTopTitle(); setNav();
        const now = store('royal_home_last');
        if (S.tab==='home' && !S.sub && JSON.stringify(now) !== before) {
          const y = window.scrollY; S.feed = { items:[], cursor:0, done:false, loading:false };
          renderHome($('#main')); window.scrollTo(0, y);
        }
        prefetchPages();
      }).catch(()=>{});
      return;
    }
    renderLogin('busy', {text:'載入中…'});
    try { await loadHome(); } catch(e) { if (S.session) renderLogin('start', {msg:errText(e)}); return; }
    document.body.style.background=''; renderShell(); goStart(); prefetchPages();
  } else renderLogin('start');
})();
// iPhone 主畫面 APP：從 LINE 切回來時，繼續領登入結果
document.addEventListener('visibilitychange', ()=>{
  const pend = store('royal_line_pending');
  if (document.visibilityState==='visible' && CONFIG.MODE==='live' && pend && !S.session) pollLine(pend);
});
