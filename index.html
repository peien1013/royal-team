let ACAD = [];
/* 本月課表：讀「RoyalTeam 行事曆」的資料（課表照舊在行事曆試算表編輯） */
async function renderSchedule(box){
  return quickRender(box, 'schedule', () => api.getSchedule(), d => drawSchedule(box, d));
}
async function drawSchedule(box, d){
  if (!d || !d.available){ box.innerHTML = '<div class="card center"><div style="font-size:40px">📅</div><div class="muted">本月課表暫時讀不到，請稍後再看。</div></div>'; return; }
  const now = parseYmd(todayStr()), sameMonth = d.year===now.getFullYear() && d.month===now.getMonth()+1;
  const isPast = dt => { if (!sameMonth) return false; const m = String(dt).match(/^(\d{1,2})\/(\d{1,2})/); return m && (+m[1]===d.month) && (+m[2] < now.getDate()); };
  const isToday = dt => { if (!sameMonth) return false; const m = String(dt).match(/^(\d{1,2})\/(\d{1,2})/); return m && +m[1]===d.month && +m[2]===now.getDate(); };
  const icon = { onsite:'📍', hybrid:'💻📍', event:'★' };
  box.innerHTML = `<div class="sched-head"><h2>${d.year} 年 ${d.month} 月課表</h2>${d.headline?`<div class="muted">${esc(d.headline)}</div>`:''}
      ${d.stale?'<div class="hint">目前顯示的是稍早的版本，網路恢復後會自動更新。</div>':''}</div>
    ${d.sections.filter(s=>s.rows.length).map(s=>`<div class="card sched sched-${s.key}">
      <div class="sched-title"><b>${icon[s.kind]||''} ${esc(s.title)}</b><span>${esc(s.sub)}</span></div>
      ${s.rows.map(r=>`<div class="sched-row ${isPast(r.date)?'past':''} ${isToday(r.date)?'today':''}">
        <div class="d"><b>${esc(r.date)}</b><small>${esc(r.dow)}</small>${isToday(r.date)?'<em>今天</em>':''}</div>
        <div class="t">${r.topic?esc(r.topic):'<span class="muted">待公布</span>'}${r.speaker?`<div class="sp">🎤 ${esc(r.speaker.split(/[、,，]/).map(x=>x.trim()).filter(Boolean).join('、'))}</div>`:''}</div></div>`).join('')}
    </div>`).join('')}
    ${d.venues.length?`<div class="card"><h3 style="margin:0 0 6px">📍 上課地點</h3>${d.venues.map(v=>`<div class="venue">${esc(v)}</div>`).join('')}</div>`:''}
    <div class="hint center">課表由皇家行事曆同步，最多約 10 分鐘更新一次</div>`;
}
function ticketPills(t){
  if (t.checkedInAt) return '<span class="pill ok">✓ 已入場</span>';
  if (t.cancelReqAt) return '<span class="pill bad">已申請取消・等管理員處理</span>';
  if (!t.fee) return '<span class="pill ok">已報名（免費）</span>';
  return t.paid ? `<span class="pill ok">已繳費 NT$${t.paidAmount.toLocaleString()}</span>` : `<span class="pill pend">等待確認付款 NT$${t.fee.toLocaleString()}</span>`;
}
const fmtTicket = id => id.replace(/^(.{4})(.{4})(.{4})$/, '$1-$2-$3');
function qrSVG(text){ return QR.svg(text, 50, 4).replace(/width="[^"]*" height="[^"]*"/, 'width="100%" height="100%"'); }
/** 輸入一行文字的小視窗 */
function promptBox(msg, value='', okText='確定', type='text', maxLen=30){
  return new Promise(res=>{
    const bg = document.createElement('div'); bg.className='dialog-bg';
    bg.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><p>${esc(msg)}</p>
      <input class="inp mb" id="pb-in" type="${type}" ${type==='number'?'inputmode="numeric" min="0"':''} maxlength="${maxLen}" value="${esc(value)}">
      <div class="row"><button class="btn btn-outline" data-r="0">取消</button><button class="btn btn-primary" data-r="1">${esc(okText)}</button></div></div>`;
    const done = ok => { const v = $('#pb-in').value.trim(); bg.remove(); res(ok ? v : null); };
    bg.addEventListener('click', e=>{ const b=e.target.closest('[data-r]'); if (b) done(b.dataset.r==='1'); else if (e.target===bg) done(false); });
    bg.addEventListener('keydown', e=>{ if (e.key==='Enter') done(true); });
    document.body.appendChild(bg); setTimeout(()=>{ const x=$('#pb-in'); if (x){ x.focus(); x.select(); } }, 50);
  });
}
/** 報名／加買：選張數（沒有上限，只受名額限制） */
function courseRegister(id){
  const c = ACAD.find(x=>x.id===id); if (!c) return;
  const has = (c.myTickets||[]).length, left = c.capacity ? Math.max(0, c.capacity - c.taken) : 99;
  let n = 1; const reqId = uid('T');
  const bg = document.createElement('div'); bg.className='sheet-bg';
  const draw = () => {
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3>${has?'加買同行票':'報名現場課'}</h3><button data-x>關閉</button></div>
      <div class="sheet-b"><div style="font-weight:800;font-size:19px">${esc(c.title)}</div>
        <div class="muted"><span class="nw">${mdZh(c.date)}</span> <wbr><span class="nw">${esc(c.time)}</span></div><div class="muted small">📍 ${esc(c.venue||'地點另行通知')}</div>
        <label class="lbl mt">要買幾張？</label>
        <div class="stepper"><button data-n="-1" ${n<=1?'disabled':''} aria-label="少一張">－</button><b id="rg-n">${n}</b><button data-n="1" ${n>=left?'disabled':''} aria-label="多一張">＋</button></div>
        <div class="hint">${has?'這些是同行的家人朋友，入場前可以改成他們的名字。':'第 1 張是你自己；多買的是同行的家人朋友，不用是 APP 的夥伴。'}${c.capacity?`<br>目前還剩 ${left} 個名額。`:''}</div>
        <div class="notice info mt">${c.fee?`共 <b>NT$${(c.fee*n).toLocaleString()}</b>（每張 NT$${c.fee.toLocaleString()}），報名後依付款說明付款，管理員確認收到後就會出現入場 QR。`:'這堂課免費，報名後馬上有入場 QR。'}</div>
        <button class="btn btn-primary mt" data-ok>確定${has?'加買':'報名'} ${n} 張</button></div></div>`;
  };
  draw();
  bg.addEventListener('click', async e=>{
    if (e.target===bg || e.target.closest('[data-x]')) return bg.remove();
    const st = e.target.closest('[data-n]'); if (st){ n = Math.max(1, Math.min(left, n + (+st.dataset.n))); return draw(); }
    if (e.target.closest('[data-ok]')){
      const b = e.target.closest('[data-ok]'); b.disabled = true; b.textContent = '處理中…';
      try { const r = await api.courseRegister(id, n, reqId); c.myTickets = r.tickets; c.myTicket = r.tickets[0]; bg.remove();
        toast(c.fee ? (has?`已加買 ${n} 張，付款確認後會出現 QR`:'報名成功！付款確認後會出現入場 QR') : (has?`已加買 ${n} 張`:'報名成功！入場請出示 QR'),'ok'); S.acadView='onsite'; renderAcademy($('#main')).then(()=>openTicket(id)); }
      catch(err){ toast(errText(err),'err'); b.disabled = false; draw(); }
    }
  });
  document.body.appendChild(bg);
}
/** 我的入場 QR（學院用）：這堂課我所有有效的票 */
function openTicket(id){
  const c = ACAD.find(x=>x.id===id); if (!c || !(c.myTickets||[]).length) return;
  const opts = { onChange: () => renderAcademy($('#main')), allowMore: true };
  openTicketSheet(c, c.myTickets, opts);
  if (CONFIG.MODE==='live' && c.myTickets.some(t => !t.paid && t.status==='active')) {   // 還沒付款的票：順便問最新狀態（管理員可能剛確認收款）
    QuickCache.fetch('courses', () => api.getCourses()).then(cs => {
      const n = cs.find(x=>x.id===id), bg = $('.sheet-bg');
      if (!n || !bg || JSON.stringify(n.myTickets) === JSON.stringify(c.myTickets)) return;
      ACAD = cs; bg.remove(); openTicketSheet(n, n.myTickets, opts);
    }).catch(()=>{});
  }
}
const TK_TAB = { unpaid:'未付款', unused:'未使用', used:'已使用', void:'已失效' };
function tkTab(t, c){
  if (t.status==='refunded' || t.status==='cancelled') return 'void';
  if (t.checkedInAt) return 'used';
  if (c && c.date < todayStr()) return 'void';
  return t.paid ? 'unused' : 'unpaid';
}
function tkVoidText(t){
  if (t.status==='refunded') return `已退費 NT$${(t.refundAmount||0).toLocaleString()}（${t.refundMethod==='cash'?'現金':'轉帳'}）`;
  if (t.status==='cancelled') return '已取消';
  return '課程已結束，沒有入場';
}
/** 票券詳情：狀態、課程、時間、地點、每張 QR（中間有皇家 logo）、改使用人、取消、報名紀錄 */

          <div class="ticket-code">票號 ${fmtTicket(t.ticketId)}</div>`:''}
          ${t.status==='active'&&!t.qr?`<div class="qr-wait"><div class="ic">⏳</div><b>等待確認付款</b><div>要繳 NT$${t.fee.toLocaleString()}</div>

          ${live(t)?`<div class="row mt" style="justify-content:center;flex-wrap:wrap">

        </div>`).join('')}
        <div class="hint center">入場時把螢幕調亮，直接給工作人員掃。一張 QR 只能入場一次。</div>
        ${opts.allowMore && c.date>=todayStr() && (!c.capacity||c.taken<c.capacity)?'<button class="btn btn-outline mt" data-more>＋ 加買同行票</button>':''}
        <div class="tk-order">
          <div><span>可轉讓票券</span><b>${ts.filter(live).length} 張</b></div>
          ${first?`<div><span>報名時間</span><b>${fmtShort(first)}</b></div>`:''}
          ${ts.some(t=>t.paidAt)?`<div><span>已繳費</span><b>NT$${ts.reduce((a,t)=>a+(t.paidAt?t.paidAmount:0),0).toLocaleString()}</b></div>`:''}
          ${ts.some(t=>t.status==='active'&&!t.paid)?`<div><span>還沒確認付款</span><b>NT$${ts.reduce((a,t)=>a+(t.status==='active'&&!t.paid?t.fee:0),0).toLocaleString()}</b></div>`:''}

let HS_TIMER = null;
function startHonorAuto(){
  clearInterval(HS_TIMER);
  const el = $('#hs-track'); if (!el) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let stop = false; const halt = () => { stop = true; };
  ['touchstart','pointerdown','wheel','keydown'].forEach(ev => el.addEventListener(ev, halt, {passive:true}));
  HS_TIMER = setInterval(() => {
    if (!document.body.contains(el)) return clearInterval(HS_TIMER);
    if (stop || document.hidden) return;
    const c = el.firstElementChild, max = el.scrollWidth - el.clientWidth; if (!c || max < 8) return;
    const step = c.offsetWidth + 10;
    el.scrollTo({ left: el.scrollLeft + step > max + 4 ? 0 : el.scrollLeft + step, behavior: 'smooth' });
  }, 3500);
}

function renderRegApply(main){
  const a = S.act, r = S.reg, R = S.rg || (S.rg = { step:1, agree:false, payMethod:'transfer', last5:'' }), fw = a && a.feeMode==='deposit' ? '保證金' : '報名費';

  const dots = `<div class="ap-steps">${Array.from({length:total},(_,i)=>`<i class="${i<stepNo?'on':''}"></i>`).join('')}</div><div class="muted small center mb">第 ${stepNo} 步／共 ${total} 步</div>`;

        ${a.courseNotes?`<li>活動期間每一堂<b>線上課</b>，上完 <b>${a.noteDays} 天內</b>要交課後心得</li>`:''}
        ${fee?(a.feeMode==='deposit'?`<li>保證金 <b>NT$${fee.toLocaleString()}</b>：<b>達標就全額退還</b>（退了還是在班上，可以繼續激勵夥伴）；沒達標不退</li>`:`<li>報名費 <b>NT$${fee.toLocaleString()}</b></li>`):''}
        ${a.note?`<li>${esc(a.note)}</li>`:''}</ol>
      <label class="big-check ${R.agree?'on':''}"><input type="checkbox" id="rg-agree" ${R.agree?'checked':''}><span>我已看完，同意以上活動規則</span></label>
      ${nav(fee?'next':'confirm','下一步')}</div>`;
  else if (R.step===2 && fee) body = `<div class="card"><h2 class="act-name">${fw} NT$${fee.toLocaleString()}</h2>
      <label class="lbl">怎麼付？</label>
      <div class="seg" style="grid-template-columns:1fr 1fr"><button data-pm="transfer" class="${R.payMethod==='transfer'?'on':''}">🏦 轉帳</button><button data-pm="cash" class="${R.payMethod==='cash'?'on':''}">💵 現金</button></div>
      ${R.payMethod==='transfer'?`<div class="notice info mt uc">${esc(r.payInfo||'')}</div>
        <label class="lbl" for="rg-last5">你的匯款帳號後五碼<span class="req">必填</span></label>
        <input class="inp" id="rg-last5" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="例如：12345" value="${esc(R.last5)}">
        <div class="hint">轉帳後填上，管理員對帳用。</div>`
      : '<div class="notice info mt">請把現金交給管理員，管理員收到後就會核准你的報名。</div>'}
      ${nav('confirm','下一步')}</div>`;
  else body = `<div class="card"><h2 class="act-name">確認報名</h2>
      <div class="kv"><span class="k">姓名</span><span class="v">${esc(S.me.name)}</span></div>
      <div class="kv"><span class="k">TW 帳號</span><span class="v">${S.me.tw?esc(S.me.tw):'（沒有填）'}</span></div>
      <div class="kv"><span class="k">活動</span><span class="v">${esc(a.name)}</span></div>
      ${fee?`<div class="kv"><span class="k">${fw}</span><span class="v">NT$${fee.toLocaleString()}</span></div>
      <div class="kv"><span class="k">繳費方式</span><span class="v">${R.payMethod==='cash'?'現金':'轉帳・後五碼 '+esc(R.last5)}</span></div>`:''}
      <div class="hint">送出後，管理員${fee?'確認收到'+fw+'':'確認'}就會核准；核准後底部按鈕會變成「我的進度」。</div>
      <div id="rg-err" class="notice err hidden mt"></div>
      <button class="btn btn-primary mt" data-rg="send">送出報名</button><button class="btn btn-outline mt" data-rg="prev">上一步</button></div>`;
  main.innerHTML = dots + body;
  const ag = $('#rg-agree'); if (ag) ag.addEventListener('change', e=>{ R.agree = e.target.checked; renderRegApply(main); });
  main.onclick = async e => {
    const pm = e.target.closest('[data-pm]'); if (pm){ const l = $('#rg-last5'); if (l) R.last5 = l.value; R.payMethod = pm.dataset.pm; return renderRegApply(main); }
    const b = e.target.closest('[data-rg]'); if (!b) return;
    const l = $('#rg-last5'); if (l) R.last5 = l.value.replace(/\D/g,'');
    const err = m => { const x = $('#rg-err'); x.textContent = m; x.classList.remove('hidden'); };
    const go2 = st => { R.step = st; window.scrollTo(0,0); renderRegApply(main); };
    if (b.dataset.rg==='prev') return go2(fee ? R.step-1 : 1);
    if (b.dataset.rg==='next') return R.agree ? go2(2) : err(errText(new Error('AGREE_REQUIRED')));
    if (b.dataset.rg==='confirm'){
      if (!R.agree) return err(errText(new Error('AGREE_REQUIRED')));
      if (fee && R.payMethod==='transfer' && !/^\d{5}$/.test(R.last5)) return err(errText(new Error('BAD_LAST5')));
      return go2(3);
    }
    if (b.dataset.rg==='send'){
      b.disabled = true; b.innerHTML = '<span class="spinner"></span> 送出中…';
      try { S.reg = await api.regApply({ agree:true, payMethod: fee ? R.payMethod : '', last5: fee && R.payMethod==='transfer' ? R.last5 : '' });
        S.rg = null; main.onclick = null; toast('已送出報名，等管理員審核','ok'); go('progress'); }
      catch(e2){ b.disabled = false; b.textContent = '送出報名'; err(errText(e2)); }
    }
  };
}

  const roots = kids[''] || [], heads = roots.filter(m=>(kids[m.id]||[]).length).sort(order), loners = roots.filter(m=>!(kids[m.id]||[]).length).sort(byName);

      ${on ? ch.map(c=>node(c, depth+1, seen)).join('') : ''}`;
  };

      <div class="sheet-b"><div class="tree-sum"><span class="pill brand">${heads.length} 條線</span><span class="pill gray">共 ${d.members.length} 人</span>${loners.length?`<span class="pill pend">還沒分線 ${loners.length} 人</span>`:''}</div>
        <div class="row mb" style="flex-wrap:wrap"><button class="btn btn-outline btn-sm" data-all="1">全部展開</button><button class="btn btn-outline btn-sm" data-all="0">全部收起</button></div>

        ${heads.length ? heads.map(h=>{ seen.add(h.id); const on = open.has(h.id), ch = (kids[h.id]||[]).slice().sort(order);
          return `<div class="tree-line"><div class="tree-head"><button class="tg" data-tg="${h.id}" aria-label="${on?'收起':'展開'}">${on?'▾':'▸'}</button>

            ${on ? ch.map(c=>node(c, 1, seen)).join('') : ''}</div>`; }).join('') : '<div class="notice info">還沒有人設定上下線。</div>'}
        ${loners.length ? `<div class="card mt" style="box-shadow:none;border:1px solid var(--line)"><h3>還沒設定上線（${loners.length} 人）</h3><div class="muted small mb">如果他是最上面的頭就不用設；不是的話，點名字 →「👥 設定上線」。</div>
          <div class="mlist">${loners.map(m=>`<button class="mrow" data-mem="${m.id}"><div class="who">${avatarHTML(m)}<div class="info"><b>${esc(m.name)}</b>${m.upText?`<div class="muted small">申請時寫的上線：${esc(m.upText)}</div>`:''}</div></div><span class="muted">›</span></button>`).join('')}</div></div>` : ''}
      </div></div>`;
    const nb = $('.sheet-b', bg); if (nb) nb.scrollTop = top;
  };
  bg.addEventListener('click', e=>{
    if (e.target===bg || e.target.closest('[data-x]')) { bg.remove(); return; }
    const tg = e.target.closest('[data-tg]'); if (tg) { const id = tg.dataset.tg; open.has(id) ? open.delete(id) : open.add(id); draw(); return; }
    const all = e.target.closest('[data-all]'); if (all) { open.clear(); if (all.dataset.all==='1') d.members.forEach(m=>{ if ((kids[m.id]||[]).length) open.add(m.id); }); draw(); return; }
    const mb = e.target.closest('[data-mem]'); if (mb) { bg.remove(); S.admin.memberId = mb.dataset.mem; S.admin.calMonth = null; S.admin.calSel = null; go('account', {sub:'adminMember'}); }
  });
  document.body.appendChild(bg); draw();
}

function choiceBox(msg, options){
  return new Promise(res=>{
    const bg = document.createElement('div'); bg.className='dialog-bg';
    bg.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div style="display:grid;gap:10px">${options.map(o=>`<button class="btn ${o.cls||'btn-primary'}" data-r="${o.v}">${o.html ? o.label : esc(o.label)}</button>`).join('')}<button class="btn btn-outline" data-r="">取消</button></div></div>`;
    bg.addEventListener('click', e=>{ const b=e.target.closest('[data-r]'); if(b||e.target===bg){ bg.remove(); res(b?b.dataset.r:''); } });
    document.body.appendChild(bg);
  });
}
/** 一張票的其他處理：退費、照常保留、改到別堂課、取消、取消繳費登記 */
async function ticketMore(id){
  const t = ADMC.tickets.find(x=>x.ticketId===id); if (!t) return;
  const who = (t.holder||t.member.name) + (t.guest ? `（${t.member.name} 的同行）` : '');
  const opts = [];
  if (t.paidAt) opts.push({v:'refund', label:'💸 退費（票作廢）', cls:'btn-danger'});
  if (ADMC.others.length) opts.push({v:'move', label:'📅 保留到別堂課'});
  if (t.cancelReqAt) opts.push({v:'keep', label:'✓ 不取消，照常上課', cls:'btn-outline'});
  if (!t.paidAt && t.fee) opts.unshift({v:'door', label:'💵 現場收款並入場'});
  if (!t.paidAt) opts.push({v:'cancel', label:'取消這張票', cls:'btn-danger'});
  if (t.paidAt) opts.push({v:'unpay', label:'取消繳費登記（登記錯了才用）', cls:'btn-outline'});
  const act = await choiceBox(`${who}
${t.cancelReqAt?'申請取消這張票，要怎麼處理？':'要怎麼處理這張票？'}`, opts); if (!act) return;
  try {
    if (act==='unpay') return ticketPay(id, true);
    if (act==='keep'){ await api.adminTicketKeep(id); toast('已保留，照常上課','ok'); }
    if (act==='door'){
      const method = await choiceBox(`${who} 現場付 NT$${t.fee.toLocaleString()}\n怎麼付的？`, [{v:'cash',label:'💵 現金'},{v:'transfer',label:'🏦 轉帳'}]); if (!method) return;
      const r = await api.adminCheckin(S.admin.courseId, 'RT1:'+t.ticketId, true, method);
      if (r.result!=='ok') throw new Error(r.result==='already'?'TICKET_LOCKED':'NOT_FOUND');
      beepOk(); toast(`${who} 已收款並入場`,'ok');
    }
    if (act==='cancel'){ if (!await confirmBox(`確定取消「${who}」這張票？`,'取消這張',true)) return; await api.adminTicketRefund(id); toast('已取消','ok'); }
    if (act==='refund'){
      const method = await choiceBox(`退給 ${who}
（實收 NT$${t.paidAmount.toLocaleString()}）怎麼退？`, [{v:'transfer',label:'🏦 轉帳'},{v:'cash',label:'💵 現金'}]); if (!method) return;
      const amt = await promptBox(`退多少錢？（最多 NT$${t.paidAmount.toLocaleString()}）`, String(t.paidAmount), '確定退費', 'number'); if (amt===null) return;
      await api.adminTicketRefund(id, +amt, method); toast(`已登記退費 NT$${(+amt).toLocaleString()}`,'ok');
    }
    if (act==='move'){
      const to = await choiceBox(`把 ${who} 的票改到哪一堂？
已繳的錢會跟著走，會換新的 QR。`, ADMC.others.map(o=>({v:o.id, label:`${mdZh(o.date)} ${o.title}`, cls:'btn-outline'}))); if (!to) return;
      await api.adminTicketMove(id, to); toast('已改到別堂課，請提醒對方用新的 QR','ok');
    }
    renderAdminCourse($('#main'));
  } catch(e){ toast(errText(e),'err'); }
}
async function ticketPay(id, undo){
  const t = ADMC.tickets.find(x=>x.ticketId===id); if (!t) return;
  let method = '';
  const who = t.holder || t.member.name;
  if (undo){ if (!await confirmBox(`取消「${who}」的繳費登記？（登記錯了才用）`,'取消登記',true)) return; }
  else { method = await choiceBox(`${who} 繳 NT$${t.fee.toLocaleString()}\n怎麼付的？`, [{v:'cash',label:'💵 現金'},{v:'transfer',label:'🏦 轉帳'}]); if (!method) return; }
  try { await api.adminTicketPay(id, method, undo); toast(undo?'已取消登記':`已登記 ${who} 繳費`,'ok'); renderAdminCourse($('#main')); }
  catch(e){ toast(errText(e),'err'); }
}
function copyTickets(){
  const rows = [['使用人','購買的夥伴','TW帳號','費用','繳費','實收','付款方式','入場時間']].concat(tkFiltered().map(t=>[t.holder||t.member.name, t.member.name, t.member.tw||'', t.fee, t.paid?'已繳':'未繳', t.paidAmount||0,
    t.paidAt?(t.payMethod==='transfer'?'轉帳':'現金'):'', t.checkedInAt?new Date(t.checkedInAt).toLocaleString('zh-TW',{hour12:false}):'']));
  const tsv = rows.map(r=>r.map(v=>String(v).replace(/[\t\n]/g,' ').replace(/^([=+\-@])/,"'$1")).join('\t')).join('\n');
  navigator.clipboard.writeText(tsv).then(()=>toast(`已複製 ${rows.length-1} 人，可直接貼到 Google 試算表`,'ok'), ()=>toast('這個瀏覽器不允許複製','err'));
}

async function startCamera(){
  const msg = $('#sc-msg'), video = $('#sc-video');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('NO_CAM');
    SCAN.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }, audio:false });
    if (!SCAN.on) return stopCamera();
    video.srcObject = SCAN.stream; await video.play(); msg.textContent = '';
    if ('BarcodeDetector' in window){ try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) SCAN.detector = new BarcodeDetector({formats:['qr_code']}); } catch(_){} }
    if (!SCAN.detector) await loadScript('vendor/jsQR.js');
    scanLoop();
  } catch(e){
    msg.innerHTML = e && e.name==='NotAllowedError' ? '相機沒有被允許。<br>請到瀏覽器設定允許相機，或用下面輸入票號。' : '這裡打不開相機。<br>用掃描槍直接掃就好；<br>或用手機的 Chrome／Safari 打開 APP 用鏡頭掃。';

/* 掃描槍＝一個鍵盤。讀實體鍵位（e.code），中文輸入法開著也不會亂碼（做法同出貨核對） */
const GUN = { buf:'', t:0 };
function gunKeydown(e){
  if (!SCAN.on) return;
  const tag = e.target && e.target.tagName;
  if (tag==='INPUT' || tag==='TEXTAREA') return;          // 讓人正常打字（手動輸入票號）
  const c = e.code; let ch = '';
  if (/^Key[A-Z]$/.test(c)) ch = c.slice(3);
  else if (/^Digit[0-9]$/.test(c)) ch = c.slice(5);
  else if (/^Numpad[0-9]$/.test(c)) ch = c.slice(6);
  else if (c==='Semicolon') ch = ':';
  else if (c==='Minus' || c==='NumpadSubtract') ch = '-';
  else if (c==='Enter' || c==='NumpadEnter'){
    e.preventDefault();
    const v = GUN.buf.trim(); GUN.buf = '';
    if (v.length >= 2) gunScan(v);
    return;
  } else return;
  const now = Date.now();
  if (now - GUN.t > 400) GUN.buf = '';                       // 間隔太久＝新的一次掃描
  GUN.t = now; GUN.buf += ch; e.preventDefault();
}
function gunScan(code){
  const res = $('#scan-res');
  if (res){
    if (res.querySelector('[data-sr]')){ beepErr(); toast('請先處理畫面上這位的繳費','err'); return; }
    if (res.classList.contains('wait')) return;
    res.remove(); SCAN.busy = false;                         // 上一位的結果還在：直接換下一位
  }
  if (SCAN.busy) return;
  scanHandle(code);
}
function stopCamera(){ if (SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; } clearTimeout(SCAN.timer); }
async function scanLoop(){
  if (!SCAN.on) return;
  const video = $('#sc-video');
  if (!SCAN.busy && video && video.readyState >= 2){
    try {
      let code = null;
      if (SCAN.detector){ const r = await SCAN.detector.detect(video); if (r.length) code = r[0].rawValue; }
      else if (window.jsQR){
        const w = video.videoWidth, h = video.videoHeight, k = Math.min(1, 720/Math.max(w,h));
        const cv = SCAN.canvas || (SCAN.canvas = document.createElement('canvas')); cv.width = Math.round(w*k); cv.height = Math.round(h*k);
        const g = cv.getContext('2d', {willReadFrequently:true}); g.drawImage(video, 0, 0, cv.width, cv.height);
        const r = jsQR(g.getImageData(0,0,cv.width,cv.height).data, cv.width, cv.height, {inversionAttempts:'dontInvert'}); if (r) code = r.data;
      }
      if (code && !(code===SCAN.last && Date.now()-SCAN.lastAt < 4000)) await scanHandle(code);   // 同一張還在鏡頭前，不重複判斷
    } catch(_){}
  }
  SCAN.timer = setTimeout(scanLoop, 150);
}
async function scanHandle(code, payNow, method){

  showScanResult('wait', '<div class="spinner" style="width:48px;height:48px"></div><div class="sub mt">確認中…</div>');
  let r;
  try { r = await api.adminCheckin(S.admin.courseId, code, payNow, method); }
  catch(e){ beepErr(); return showScanResult('bad', `<div class="big">!</div><h2>網路不穩</h2><div class="sub">沒有確認成功，請再掃一次</div>`, 3000); }
  const who = r.member ? (r.member.guest
    ? `<div class="who">${esc(r.member.holder)}</div><div class="sub">${esc(r.member.name)} 的同行</div>`
    : `<div class="who">${avatarHTML(r.member,'lg')}${esc(r.member.holder||r.member.name)}</div>`) : '';
  if (r.result==='ok'){
    beepOk(); SCAN.inCount++; const n=$('#sc-n'); if (n) n.textContent = SCAN.inCount;
    return showScanResult('ok', `<div class="big">✓</div><h2>歡迎入場</h2>${who}<div class="sub">${r.paidNow?`已登記現場收款 NT$${r.fee.toLocaleString()}（${method==='transfer'?'轉帳':'現金'}）`:r.fee?'已繳費':'免費課程'}</div>`, 1800);
  }
  if (r.result==='already'){ beepDup();
    return showScanResult('warn', `<div class="big">!</div><h2>已經入場過了</h2>${who}<div class="sub">第一次入場：${hhmm(r.at)}</div>`, 3500); }
  beepErr();
  if (r.result==='unpaid') return showScanResult('bad', `<div class="big">✗</div><h2>尚未繳費</h2>${who}<div class="sub">要繳 NT$${r.fee.toLocaleString()}</div>
    <div class="acts"><button data-sr="cash">💵 現場收現金並入場</button><button data-sr="transfer">🏦 已確認轉帳，讓他入場</button><button class="alt" data-sr="no">先不要入場</button></div>`, 0, code);
  if (r.result==='replaced') return showScanResult('bad', `<div class="big">✗</div><h2>這張 QR 已經轉讓</h2>${who}<div class="sub">請對方打開最新的入場 QR（舊截圖不能用）</div>`, 4000);
  if (r.result==='cancelled') return showScanResult('bad', `<div class="big">✗</div><h2>這張票已取消／退費</h2>${who}`, 4000);
  if (r.result==='moved') return showScanResult('bad', `<div class="big">✗</div><h2>這張票已改到別堂課</h2>${who}<div class="sub">請對方用新的入場 QR</div>`, 4000);
  if (r.result==='wrong_course') return showScanResult('bad', `<div class="big">✗</div><h2>不是這堂課的票</h2>${who}<div class="sub">${r.courseTitle?'這張是：'+esc(r.courseTitle):''}</div>`, 3500);
  return showScanResult('bad', `<div class="big">✗</div><h2>看不懂這張 QR</h2><div class="sub">請夥伴打開 APP「學院」→「我的入場 QR」再掃一次</div>`, 3000);
}
function showScanResult(kind, html, autoMs, code){
  let el = $('#scan-res'); if (el) el.remove();
  el = document.createElement('div'); el.className = 'scan-res '+kind; el.id='scan-res';
  el.innerHTML = html + (kind==='wait' || code ? '' : '<div class="tap">點一下畫面繼續掃描</div>');
  document.body.appendChild(el);
  if (kind==='wait') return;
  const done = ()=>{ if (!el.isConnected) return; el.remove(); SCAN.busy=false; SCAN.lastAt=Date.now(); };
  if (autoMs) setTimeout(done, autoMs);
  el.addEventListener('click', e=>{
    const b = e.target.closest('[data-sr]');
    if (code){ if (!b) return; if (b.dataset.sr==='no') return done(); el.remove(); scanHandle(code, true, b.dataset.sr); return; }
    done();
  });
}
function scanClick(e){

    case 'person': if (el.dataset.id === (S.me && S.me.id)) { go('progress'); break; } S.personId = el.dataset.id; S.personBack = S.sub; go(S.tab, {sub:'person'}); break;
    case 'dreams': go(S.tab, {sub:'dreams'}); break;
    case 'scope': if (S.scope !== el.dataset.s) { S.scope = el.dataset.s; S.feed = { items:[], cursor:0, done:false, loading:false }; renderHome($('#main')); } break;
    case 'team': S.teamFilter = el.dataset.f || S.teamFilter || 'all'; go(S.tab, {sub:'team'}); break;
    case 'team-f': S.teamFilter = el.dataset.f; drawTeamList(); break;
    case 'team-act': S.teamActId = el.dataset.id; renderTeam($('#main')); break;
    case 'team-add': teamAddSheet(); break;
    case 'team-edit': S.teamEdit = !S.teamEdit; renderTeam($('#main')); break;
    case 'team-rm': if (await confirmBox(`把「${el.dataset.name}」從你的直接下線移除？`, '移除', true)) {
        try { await api.teamRemoveDown(el.dataset.id); toast(`已移除：${el.dataset.name}`,'ok'); afterTeamChange(); } catch(err){ toast(errText(err),'err'); } }
      break;
    case 'adm-act': S.admin.actId = el.dataset.id; renderAdmin($('#main')); break;
    case 'prog-act': S.progActId = el.dataset.id; S.calSel = null; drawProgress($('#main')); break;
    case 'tmember': S.tmId = el.dataset.id; S.tmBack = S.sub; go(S.tab, {sub:'tmember'}); break;
    case 'tm-posts-more': S.tmAll = true; drawTmPosts(); break;
    case 'set-upline': setUpline(el.dataset.id); break;
    case 'set-rank': case 'set-coe': { const id = el.dataset.id, cur = (S.badges && S.badges[id]) || { r:'', c:0 };
      const v = act==='set-rank' ? await pickRank(cur.r) : await pickCoe(cur.c); if (v === null) break;
      try { if (act==='set-rank') await api.adminHonorRank(id, v); else await api.adminSetCoe(id, v);
        S.badges = S.badges || {}; const nb = { r: act==='set-rank' ? v : cur.r, c: act==='set-coe' ? v : cur.c };
        if (nb.r || nb.c) S.badges[id] = nb; else delete S.badges[id];
        QuickCache.dropPrefix('home'); toast('已更新','ok'); if (S.sub==='adminMember') renderAdminMember($('#main')); }
      catch(err){ toast(errText(err),'err'); } break; }
    case 'dream-edit': S.dreamBack = S.sub; go(S.tab, {sub:'dreamEdit'}); break;
    case 'dream-tick': dreamTick(+el.dataset.i); break;
    case 'dream-zoom': { const lb=document.createElement('div'); lb.className='lightbox'; lb.innerHTML=`<img src="${el.src}" alt="夢想版"><button>關閉 ✕</button>`; lb.addEventListener('click',()=>lb.remove()); document.body.appendChild(lb); break; }
    case 'gcal-prev': S.gMonth=monthShift(S.gMonth,-1); drawGrowthCal(); break;
    case 'gcal-next': S.gMonth=monthShift(S.gMonth,1); drawGrowthCal(); break;
    case 'gcal-day': break;
    case 'tmcal-prev': S.tmMonth=monthShift(S.tmMonth,-1); { const b=$('#tm-cal'); if (b&&TM) b.innerHTML = calendarHTML(dayMap(TM.progress), TM.activity, S.tmMonth, null, 'tmcal'); } break;
    case 'tmcal-next': S.tmMonth=monthShift(S.tmMonth,1); { const b=$('#tm-cal'); if (b&&TM) b.innerHTML = calendarHTML(dayMap(TM.progress), TM.activity, S.tmMonth, null, 'tmcal'); } break;
    case 'tmcal-day': break;
    case 'reg-manage': regManage(); break;
    case 'fee-open': openFeeSheet(); break;
    case 'admin-fee': adminFeeSheet(); break;
    case 'dep-refund': { const on = el.dataset.on === '1';
      if (on && !await confirmBox(`確定已經把保證金 NT$${(+el.dataset.fee).toLocaleString()} 退給「${el.dataset.name}」了嗎？\n退了之後他還是在班上，照常打卡。`, '已退')) break;
      el.disabled = true; try { await api.adminDepositRefund(el.dataset.aid, el.dataset.id, on); toast(on?'已標記退還':'已取消退還','ok'); QuickCache.dropPrefix('adm'); renderAdmin($('#main')); } catch(err){ el.disabled = false; toast(errText(err),'err'); } break; }
    case 'reg-apply': S.rg = { step:1, agree:false, payMethod:'transfer', last5:'' }; go(S.tab, {sub:'regApply'}); break;
    case 'rename': { const v = await promptBox('改成真實姓名', el.dataset.name, '儲存'); if (v === null || v === el.dataset.name) break;
      if (!validName(v)) { toast(errText(new Error('BAD_NAME')),'err'); break; }
      try { await api.adminRename(el.dataset.id, v); toast('姓名已更新','ok'); renderAdminMember($('#main')); } catch(err){ toast(errText(err),'err'); } break; }
    case 'reg-ok': case 'reg-no': el.disabled=true; try { await api.adminRegReview(el.dataset.id, act==='reg-ok'); toast(act==='reg-ok'?'已核准，對方加入衝刺班':'已退回','ok'); } catch(err){ toast(errText(err),'err'); } renderAdmin($('#main')); break;
    case 'reg-import': regImport(); break;
    case 'hon-add': honorAdd(el.dataset.id||''); break;
    case 'hon-quote': honorEditQuote(el.dataset.id); break;
    case 'hon-manage': honorManage(el.dataset.id); break;
    case 'show-more': { const t=$('.post-text',postEl); t.classList.remove('clamp'); el.remove(); queueRead(pid); break; }
    case 'photo': { queueRead(pid); const lb=document.createElement('div'); lb.className='lightbox'; lb.innerHTML=`<img src="${el.src}" alt=""><button>關閉 ✕</button>`; lb.addEventListener('click',()=>lb.remove()); document.body.appendChild(lb); break; }
    case 'like': openReactionPicker(el, pid); break;
    case 'react': {
      const p = findPost(el.dataset.pid), k = el.dataset.k; closeReactionPicker();
      if (!p) break;
      const prev = { myReaction:p.myReaction||'', likeCount:p.likeCount, reactionCounts:{...(p.reactionCounts||{})} };
      // 先更新畫面，失敗再改回
      const rc = {...(p.reactionCounts||{})};
      if (prev.myReaction) rc[prev.myReaction] = Math.max(0, (rc[prev.myReaction]||1) - 1);
      const next = prev.myReaction === k ? '' : k;
      if (next) rc[next] = (rc[next]||0) + 1;
      Object.assign(p, { myReaction:next, liked:!!next, reactionCounts:rc, likeCount: prev.likeCount + (prev.myReaction?0:1) - (next?0:1) });
      refreshPostStats(p.id);
      try {
        const r = await api.react(p.id, k);
        Object.assign(p, { myReaction:r.myReaction, liked:!!r.myReaction, likeCount:r.likeCount, reactionCounts:r.reactionCounts });
        if (!p.mine && r.readCount!=null) p.readCount = r.readCount; Read.sent.add(p.id);
      } catch(err){ Object.assign(p, prev, {liked:!!prev.myReaction}); toast('沒有送出成功，請再試一次','err'); }
      refreshPostStats(p.id); break; }
    case 'comments': openComments(pid); break;
    case 'post-menu': {
      const bg=document.createElement('div'); bg.className='sheet-bg';
      bg.innerHTML=`<div class="sheet"><div class="sheet-b menu-list"><button data-m="edit">✏️ 編輯這篇</button><button data-m="del" style="color:var(--bad)">🗑️ 刪除這篇</button><button data-m="x">取消</button></div></div>`;
      document.body.appendChild(bg);
      bg.addEventListener('click', async ev=>{
        const b=ev.target.closest('[data-m]'); if(!b && ev.target!==bg) return; bg.remove(); if(!b) return;
        const p=findPost(pid);
        if (b.dataset.m==='edit'){ S.editing=p; S.draft=newDraft({actionDate:p.actionDate, dateMode:p.actionDate===todayStr()?'today':p.actionDate===addDays(todayStr(),-1)?'yday':'other', text:p.text, photos:p.photoUrls.slice(), photoInfo:'', courseId:p.course&&p.course.id, courseTitle:p.course&&p.course.title}); go('compose'); }
        if (b.dataset.m==='del'){ if(!(await confirmBox('確定要刪除這篇日誌嗎？刪除後這天的打卡會重新計算。','刪除',true))) return;
          try{ await api.deletePost(pid); S.feed.items=S.feed.items.filter(x=>x.id!==pid); S.feed.cursor=Math.max(0,S.feed.cursor-1); if(S.myPosts) S.myPosts=S.myPosts.filter(x=>x.id!==pid); $$(`.post[data-id="${pid}"]`).forEach(x=>x.remove()); await loadHome(); updateCheckinBtn(); toast('已刪除'); }
          catch(err){ toast(errText(err),'err'); } }
      }); break; }
    /* 發文 */
    case 'date-mode': {
      const d=S.draft, m=el.dataset.m; d.dateMode=m; d.text=$('#c-text').value;
      if (m==='today') d.actionDate=todayStr(); if (m==='yday') d.actionDate=addDays(todayStr(),-1);
      renderCompose($('#main')); if (m==='other') { const i=$('#c-date'); i.focus(); try{ i.showPicker && i.showPicker(); }catch(_){} } break; }
    case 'photo-cam': S.draft.text=$('#c-text').value; $('#f-cam').click(); break;
    case 'photo-lib': S.draft.text=$('#c-text').value; $('#f-lib').click(); break;
    case 'photo-rm': S.draft.text=$('#c-text').value; S.draft.photos.splice(Number(el.dataset.i),1); S.draft.photoInfo=''; renderCompose($('#main')); break;
    case 'course-clear': S.draft.text=$('#c-text').value; S.draft.courseId=null; S.draft.courseTitle=null; renderCompose($('#main')); break;
    case 'submit': submitPost(); break;
    case 'cancel-edit': S.editing=null; S.draft=null; go('home'); break;
    /* 進度日曆 */
    case 'cal-prev': S.calMonth=monthShift(S.calMonth,-1); $('#cal').innerHTML=calendarHTML(dayMap(S.pPr||S.progress),S.pAct||S.act,S.calMonth,S.calSel); break;
    case 'cal-next': S.calMonth=monthShift(S.calMonth,1); $('#cal').innerHTML=calendarHTML(dayMap(S.pPr||S.progress),S.pAct||S.act,S.calMonth,S.calSel); break;
    case 'cal-day': S.calSel=el.dataset.d; $('#cal').innerHTML=calendarHTML(dayMap(S.pPr||S.progress),S.pAct||S.act,S.calMonth,S.calSel); drawDayDetail(S.calSel); break;
    /* 學院 */
    case 'zoom': toast('正式上線後，這裡會直接開啟 Zoom 會議'); break;
    case 'replay': toast('正式上線後，這裡會開啟回放影片'); break;
    case 'share-course': S.editing=null; S.draft=newDraft({courseId:el.dataset.id, courseTitle:el.dataset.title, text:'', actionDate:todayStr(), dateMode:'today'}); go('compose'); break;
    /* 帳號 */
    case 'bind': toast('正式上線後，這裡會引導你用 LINE 或 Email 驗證後綁定'); break;
    case 'logout': if (await confirmBox('確定要登出嗎？','登出')) { try { await api.logout(); } catch(_){} QuickCache.clear(); store(SESSION_KEY,null); S.session=null; S.feed={items:[],cursor:0,done:false,loading:false}; renderLogin('start'); } break;
    case 'logout-all': if (await confirmBox('會讓你在所有手機和電腦上都登出，確定嗎？','全部登出',true)) {
      try { await api.logoutAll(); } catch(err){ toast(errText(err),'err'); break; }
      store(SESSION_KEY,null); S.session=null; S.feed={items:[],cursor:0,done:false,loading:false}; renderLogin('start',{msg:'已登出所有裝置。', ok:true}); } break;
    case 'open-admin': go('account',{sub:'admin'}); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt = null; } else toast('請按 Chrome 右上角「⋮」→「加到主畫面」'); break;
    case 'install-guide': openInstallGuide(false); break;
    case 'copy-app-link': { const u = location.origin + location.pathname; try { await navigator.clipboard.writeText(u); toast('已複製網址','ok'); } catch(_){ await promptBox('長按下面的網址複製', u, '好'); } break; }
    case 'admin-tree': adminTreeSheet(); break;
    case 'admin-roster': go('account', {sub:'adminRoster'}); break;
    case 'roster-f': S.rosterF = el.dataset.f; drawRoster(); break;
    case 'roster-row': { const r = ROSTER && ROSTER.rows.find(x=>x.id===el.dataset.id); if (!r) break;
      if (r.status==='pending') { go('account',{sub:'admin'}); break; }
      S.memBack = 'roster'; S.admin.memberId = r.id; S.admin.calMonth = null; S.admin.calSel = null; go('account',{sub:'adminMember'}); break; }
    case 'roster-csv': rosterCSV(); break;
    case 'roster-del-mode': S.rosterDel = !S.rosterDel; renderAdminRoster($('#main')); break;
    case 'roster-del': case 'member-del': { const id = el.dataset.id, r = (ROSTER && ROSTER.rows.find(x=>x.id===id)) || { name: el.dataset.name || '', upName: el.dataset.up || '' };
      if (!await confirmBox(`確定要刪除「${r.name}」嗎？\n\n・他會從名單、總表、樹狀圖、動態牆消失，不能再登入\n・他的下線會改接到${r.upName?'「'+r.upName+'」':'沒有上線'}\n・打卡、繳費紀錄會留在試算表備查\n\n刪掉之後如果要回來，要請他重新申請。`, '刪除', true)) break;
      el.disabled = true;
      try { const x = await api.adminDeleteMember(id); toast(`已刪除 ${r.name}${x.moved?`，${x.moved} 位下線改接到${x.movedTo||'沒有上線'}`:''}`,'ok');
        QuickCache.dropPrefix('roster'); QuickCache.dropPrefix('adm'); QuickCache.dropPrefix('home'); if (S.badges) delete S.badges[id];
        if (act==='member-del') go('account',{sub:'adminRoster'}); else renderAdminRoster($('#main')); }
      catch(err){ el.disabled = false; toast(errText(err),'err'); } break; }
    /* 後台 */
    case 'admin-member': S.admin.memberId=el.dataset.id; S.admin.calMonth=null; S.admin.calSel=null; go('account',{sub:'adminMember'}); break;
    case 'acal-prev': S.admin.calMonth=monthShift(S.admin.calMonth,-1); renderAdminMember($('#main')); break;
    case 'acal-next': S.admin.calMonth=monthShift(S.admin.calMonth,1); renderAdminMember($('#main')); break;
    case 'acal-day': S.admin.calSel=el.dataset.d; renderAdminMember($('#main')); break;
    case 'rev-ok': case 'rev-no': el.disabled=true; try { await api.adminReview(el.dataset.id, act==='rev-ok'?'approve':'reject'); toast(act==='rev-ok'?'已計入打卡，天數已重新計算':'已設為不計入','ok'); } catch(err){ toast(errText(err),'err'); } renderAdmin($('#main')); break;
    case 'app-ok': case 'app-no': el.disabled=true; try { await api.adminApprove(el.dataset.id, act==='app-ok'); toast(act==='app-ok'?'已核准，對方再登入一次就能使用':'已退回','ok'); } catch(err){ toast(errText(err),'err'); } renderAdmin($('#main')); break;
    case 'export-csv': exportCSV(); break;
    case 'course-register': courseRegister(el.dataset.id); break;
    case 'my-ticket': openTicket(el.dataset.id); break;
    case 'acad-view': S.acadView=el.dataset.v; renderAcademy($('#main')); break;
    case 'admin-course': S.admin.courseId=el.dataset.id; S.admin.tf='all'; go('account',{sub:'adminCourse'}); break;
    case 'tk-filter': S.admin.tf=el.dataset.f; $$('.chipbar button').forEach(b=>b.classList.toggle('on', b===el)); drawTickets(); break;
    case 'tk-pay': ticketPay(el.dataset.id, false); break;
    case 'tk-unpay': ticketPay(el.dataset.id, true); break;
    case 'tk-more': ticketMore(el.dataset.id); break;
    case 'my-tickets': S.tkTab = null; go(S.tab, {sub:'tickets'}); break;
    case 'open-staff': go('account', {sub:'staffScan'}); break;
    case 'staff-scan': staffOpenScanner(+el.dataset.i); break;
    case 'set-staff': { const on = el.dataset.on==='1';
      if (!await confirmBox(on?'設成工作人員？\n他可以在「我的帳號」用掃描入場，看不到後台其他資料。':'取消他的工作人員身分？', on?'設成工作人員':'取消工作人員', !on)) break;
      try { await api.adminSetRole(el.dataset.id, on?'staff':'member'); toast(on?'已設成工作人員':'已取消工作人員','ok'); renderAdminMember($('#main')); } catch(e){ toast(errText(e),'err'); }
      break; }
    case 'tk-tab': S.tkTab = el.dataset.t; renderMyTickets($('#main')); break;
    case 'my-posts-more': if (!S.myPostsAll){ S.myPostsAll = true; loadMyPosts(); } break;
    case 'tk-go-onsite': S.acadView='onsite'; go('academy'); break;
    case 'tk-open': { const g = MYTK.view[+el.dataset.i]; if (g) openTicketSheet(g.c, g.tickets, { onChange: () => renderMyTickets($('#main')) }); break; }
    case 'tk-copy': copyTickets(); break;
    case 'scan-open': openScanner(); break;
    case 'copy-list': copyList(); break;
  }
});
document.addEventListener('keydown', e=>{ if (e.key==='Enter' && e.target.matches('[role="button"][data-act]')) e.target.click(); });

/* ---------- 啟動 ---------- */
(async function start(){
  const params = new URLSearchParams(location.search);
  if (CONFIG.MODE==='live' && (params.get('code') || params.get('error')) && params.get('state')) return handleLineReturn(params);
  const pend = store('royal_line_pending');
  if (CONFIG.MODE==='live' && pend && Date.now() - pend.at < 15*60000) return pollLine(pend);
  const sess = store(SESSION_KEY);
  if (sess && sess.expiresAt > Date.now()) {
    S.session = sess;
    const last = CONFIG.MODE==='live' ? store('royal_home_last') : null;
    if (last && last.me) {   // 秒開：先用上一次的首頁，背景再更新
      applyHome(last); api._prefetch = { at:Date.now(), feed:last.feed };
      document.body.style.background=''; renderShell(); goStart();
      const before = JSON.stringify(last);
      loadHome().then(() => {
        setTopTitle(); setNav();
        const now = store('royal_home_last');
        if (S.tab==='home' && !S.sub && JSON.stringify(now) !== before) {
          const y = window.scrollY; S.feed = { items:[], cursor:0, done:false, loading:false };
          renderHome($('#main')); window.scrollTo(0, y);
        }
        prefetchPages();
      }).catch(()=>{});
      return;
    }
    renderLogin('busy', {text:'載入中…'});
    try { await loadHome(); } catch(e) { if (S.session) renderLogin('start', {msg:errText(e)}); return; }
    document.body.style.background=''; renderShell(); goStart(); prefetchPages();
  } else renderLogin('start');
})();
// iPhone 主畫面 APP：從 LINE 切回來時，繼續領登入結果
document.addEventListener('visibilitychange', ()=>{
  const pend = store('royal_line_pending');
  if (document.visibilityState==='visible' && CONFIG.MODE==='live' && pend && !S.session) pollLine(pend);
});
</script>
